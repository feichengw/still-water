<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03161b" />
<title>静水 · Still Water ｜ 桌面海缸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+SC:wght@400;600&family=Nunito+Sans:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#eaf6f3;
    --ink-dim:rgba(221,242,238,.60);
    --line:rgba(255,255,255,.16);
    --glass-hi:rgba(255,255,255,.105);
    --glass-lo:rgba(255,255,255,.035);
    --aqua:#8fe3d2;
    --serif:"Fraunces","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"Nunito Sans","Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#03161b;color:var(--ink);
    font-family:var(--sans);font-weight:300;
    overflow:hidden;touch-action:none;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #tank{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 45%, #0a2b33 0%, #04171c 60%, #021015 100%);
    z-index:0;cursor:crosshair;
  }
  .glass-frame{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    box-shadow:
      inset 0 0 0 1px rgba(220,255,250,.10),
      inset 0 0 140px rgba(0,12,18,.62),
      inset 0 0 26px rgba(200,255,250,.05);
    background:
      linear-gradient(to bottom, rgba(215,250,246,.10), rgba(215,250,246,0) 9%),
      linear-gradient(to top, rgba(150,215,220,.10), rgba(150,215,220,0) 8%),
      linear-gradient(to right, rgba(215,250,246,.11), rgba(215,250,246,0) 6%),
      linear-gradient(to left, rgba(215,250,246,.11), rgba(215,250,246,0) 6%);
  }
  .hud{
    position:fixed;z-index:4;pointer-events:none;
    transition:opacity .55s ease, transform .55s ease;
  }
  .topbar{
    top:0;left:0;right:0;padding:26px 32px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  }
  .brand h1{
    margin:0;display:flex;align-items:baseline;gap:14px;
    font-family:var(--serif);font-weight:400;font-size:33px;
    letter-spacing:.20em;line-height:1;text-shadow:0 2px 24px rgba(0,20,24,.55);
  }
  .brand h1 .latin{
    font-style:italic;font-weight:300;font-size:13.5px;letter-spacing:.24em;
    color:rgba(214,248,242,.66);transform:translateY(-5px);
  }
  .brand .sub{
    margin:9px 0 0;font-size:10px;letter-spacing:.36em;text-transform:uppercase;
    color:rgba(196,236,231,.42);
  }
  .status{
    position:fixed;top:26px;right:32px;z-index:5;
    display:flex;gap:10px;align-items:stretch;pointer-events:auto;
  }
  .counts,.quality{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
    backdrop-filter:blur(20px) saturate(135%);
    -webkit-backdrop-filter:blur(20px) saturate(135%);
    box-shadow:0 14px 40px rgba(0,10,15,.35), inset 0 1px 0 rgba(255,255,255,.20);
    font-size:12px;letter-spacing:.06em;color:var(--ink-dim);
  }
  .counts b{
    font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);
    margin-right:6px;font-variant-numeric:tabular-nums;
  }
  .counts i{font-style:normal;font-size:11px;letter-spacing:.14em}
  .counts .sep{opacity:.35;margin:0 2px}
  .quality{gap:9px}
  .quality .q-label{font-size:10.5px;letter-spacing:.18em;color:rgba(200,238,232,.5)}
  .quality .q-bar{
    width:82px;height:4px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .quality .q-bar i{
    display:block;height:100%;width:16%;border-radius:99px;
    background:linear-gradient(90deg,#89e2cf,#cfe9a8);
    box-shadow:0 0 10px rgba(140,230,208,.55);
    transition:width .8s ease;
  }
  .quality .q-state{font-size:11px;color:rgba(210,246,240,.78);letter-spacing:.10em}
  .hint{
    left:50%;bottom:104px;transform:translateX(-50%);
    padding:8px 16px;border-radius:99px;white-space:nowrap;
    font-size:11.5px;letter-spacing:.10em;color:rgba(214,246,242,.62);
    background:rgba(3,20,24,.42);border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .8s ease;
  }
  .hint kbd{
    font-family:var(--serif);font-size:11px;font-style:italic;
    padding:1px 6px;border-radius:5px;margin:0 2px;
    border:1px solid rgba(255,255,255,.18);color:rgba(226,252,246,.85);
  }
  .hint.hide{opacity:0}
  .dock{
    left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:2px;padding:9px 10px;border-radius:24px;
    pointer-events:auto;max-width:calc(100vw - 28px);overflow-x:auto;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 22px 60px rgba(0,10,15,.45), inset 0 1px 0 rgba(255,255,255,.22);
    scrollbar-width:none;touch-action:pan-x;
  }
  .dock::-webkit-scrollbar{display:none}
  .btn{
    position:relative;flex:0 0 auto;
    width:62px;height:54px;border-radius:17px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1px solid transparent;
    color:rgba(222,248,243,.80);cursor:pointer;
    transition:background .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
  .btn .key{
    position:absolute;right:9px;bottom:6px;
    font-family:var(--serif);font-style:italic;font-size:9px;
    color:rgba(220,250,245,.42);
  }
  .btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.on{background:rgba(143,227,210,.14);border-color:rgba(143,227,210,.36);color:#d8fff6}
  .btn.on .key{color:rgba(190,255,240,.75)}
  .btn.planned{opacity:.42}
  .btn.planned:hover{opacity:.62}
  .btn.planned::after{
    content:"";position:absolute;top:8px;right:9px;width:3px;height:3px;border-radius:50%;
    background:rgba(255,255,255,.35);
  }
  .toast{
    position:fixed;left:50%;bottom:108px;z-index:6;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:9px 18px;border-radius:99px;white-space:nowrap;
    font-size:12px;letter-spacing:.08em;color:rgba(230,253,248,.9);
    background:rgba(4,26,31,.72);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 12px 32px rgba(0,8,12,.45);
    transition:opacity .28s ease, transform .28s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  #boot{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(120% 90% at 50% 40%, #0a2c33 0%, #04161b 55%, #020d11 100%);
    transition:opacity .9s ease;
  }
  #boot .boot-title{
    font-family:var(--serif);font-size:44px;letter-spacing:.30em;text-indent:.30em;
    color:rgba(232,252,247,.92);margin-bottom:2px;
  }
  #boot .boot-word{font-size:10px;letter-spacing:.42em;text-indent:.42em;color:rgba(200,240,234,.45)}
  #boot .boot-bar{width:168px;height:1px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
  #boot .boot-bar i{
    position:absolute;top:0;left:0;height:100%;width:42%;
    background:linear-gradient(90deg,transparent,#9fe6d8,transparent);
    animation:bootSlide 1.5s ease-in-out infinite;
  }
  @keyframes bootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
  body.ready #boot{opacity:0;pointer-events:none}
  body.bare .topbar,body.bare .dock,body.bare .hint,body.bare .drawer{opacity:0;pointer-events:none;transform:translateY(-6px)}
  body.bare .status,body.bare .dock button{pointer-events:none}
  body.bare .dock{transform:translate(-50%,12px)}
  #fatal{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;
    background:linear-gradient(180deg,#061a20,#020c10);
  }
  #fatal[hidden]{display:none}
  #fatal h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.12em}
  #fatal p{margin:0;max-width:560px;font-size:13px;line-height:1.8;color:rgba(214,242,237,.66)}
  #fatal pre{
    margin:6px 0 0;max-width:760px;max-height:260px;overflow:auto;
    font-size:11px;line-height:1.6;text-align:left;color:rgba(180,220,215,.5);
    background:rgba(255,255,255,.04);padding:12px 16px;border-radius:12px;
  }
  .drawer{
    position:fixed;right:20px;bottom:104px;z-index:5;
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    pointer-events:none;
  }
  .drawer-panel{
    position:relative;pointer-events:none;width:272px;
    max-height:calc(100vh - 220px);overflow-y:auto;
    padding:14px;border-radius:20px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:0 24px 64px rgba(0,10,15,.5), inset 0 1px 0 rgba(255,255,255,.22);
    transform:translateX(310px);opacity:0;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease;
  }
  .drawer.open .drawer-panel{transform:none;opacity:1;pointer-events:auto}
  .drawer-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-right:18px}
  .drawer-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:14px;letter-spacing:.18em}
  .drawer-head span{font-size:9.5px;letter-spacing:.10em;color:rgba(210,245,238,.5);font-variant-numeric:tabular-nums}
  .drawer-x{
    position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
    color:rgba(230,252,246,.7);font-size:14px;line-height:1;cursor:pointer;
  }
  .drawer-x:hover{background:rgba(255,255,255,.12)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{
    position:relative;border-radius:13px;padding:7px 7px 8px;cursor:grab;
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    transition:transform .2s ease,border-color .2s ease,background .2s ease;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
  }
  .card:hover{transform:translateY(-2px);border-color:rgba(143,227,210,.42);background:rgba(143,227,210,.08)}
  .card:active{cursor:grabbing}
  .card .thumb{
    height:48px;border-radius:9px;background-color:rgba(130,215,205,.10);
    background-size:contain;background-position:center;background-repeat:no-repeat;
  }
  .card .nm{font-size:11px;margin-top:6px;letter-spacing:.06em;color:rgba(235,252,248,.92)}
  .card .lt{font-size:6.8px;color:rgba(200,238,232,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;margin-top:1px}
  .card .ct{position:absolute;top:9px;right:9px;font-size:9px;color:rgba(220,250,244,.55);font-variant-numeric:tabular-nums}
  .card.locked{cursor:pointer;opacity:.46}
  .card.locked .thumb{display:flex;align-items:center;justify-content:center;font-size:8.5px;letter-spacing:.14em;color:rgba(220,250,240,.45)}
  .drawer-foot{margin-top:10px;font-size:8.5px;line-height:1.7;letter-spacing:.05em;color:rgba(200,238,232,.38)}
  .drawer-tab{
    pointer-events:auto;display:flex;align-items:center;gap:7px;
    padding:9px 14px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    color:rgba(230,252,247,.85);font-size:10.5px;letter-spacing:.16em;
    box-shadow:0 14px 36px rgba(0,10,15,.4), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .drawer-tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .drawer-tab:hover{background:rgba(255,255,255,.1)}
  .drawer-tab .dot{width:5px;height:5px;border-radius:50%;background:var(--aqua);box-shadow:0 0 8px rgba(143,227,210,.8)}
  @media (max-width:820px){
    .drawer{left:10px;right:10px;bottom:76px;align-items:stretch}
    .drawer-panel{width:auto;max-height:40vh;padding:12px;transform:translateY(130%)}
    .drawer.open .drawer-panel{transform:none}
    .drawer-head{margin-bottom:8px}
    .cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .cards::-webkit-scrollbar{display:none}
    .card{flex:0 0 96px}
    .drawer-tab{align-self:flex-end}
  }
  @media (max-width:820px){
    .topbar{padding:16px 16px;gap:10px}
    .status{top:16px;right:16px}
    .brand h1{font-size:25px;letter-spacing:.14em;gap:8px}
    .brand h1 .latin{display:none}
    .brand .sub{font-size:8.5px;letter-spacing:.24em;margin-top:6px}
    .counts,.quality{padding:8px 12px;border-radius:13px;font-size:11px;gap:7px}
    .counts b{font-size:16px}
    .quality .q-bar{width:52px}
    .quality .q-label{display:none}
    .dock{bottom:12px;padding:7px 8px;border-radius:20px}
    .btn{width:48px;height:46px;border-radius:14px}
    .btn svg{width:17px;height:17px}
    .hint{bottom:78px;font-size:10.5px;padding:7px 12px}
    .toast{bottom:80px;font-size:11px}
  }
  @media (max-width:560px){
    .topbar{padding:12px;gap:8px;flex-direction:column;align-items:stretch}
    .brand{max-width:none}
    .brand h1{font-size:21px;letter-spacing:.10em}
    .brand .sub{font-size:7.5px;letter-spacing:.18em;margin-top:5px}
    .status{display:none}
    .counts{padding:6px 9px;gap:5px;font-size:10px}
    .counts b{font-size:14px;margin-right:3px}
    .counts i{font-size:9.5px;letter-spacing:.06em}
    .quality{padding:6px 9px;gap:5px}
    .quality .q-bar{width:34px}
    .quality .q-state{font-size:9.5px}
    .dock{padding:6px;border-radius:18px;width:calc(100vw - 20px);max-width:none;flex-wrap:wrap;justify-content:center}
    .btn{width:38px;height:40px;border-radius:12px}
    .btn svg{width:15px;height:15px}
    .btn .key{right:5px;bottom:3px;font-size:8px}
    .hint{max-width:calc(100vw - 24px);white-space:normal;text-align:center;line-height:1.55;font-size:10px}
    .toast{max-width:calc(100vw - 32px);white-space:normal;text-align:center}
    .quality{display:none}
    .btn.planned{display:none}
  }
  /* 机位切换器 */
  #camDock{
    position:fixed; left:18px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px; z-index:30;
    padding:10px 8px; border-radius:14px;
    background:rgba(12,34,42,.42); backdrop-filter:blur(12px) saturate(1.1);
    -webkit-backdrop-filter:blur(12px) saturate(1.1);
    border:1px solid rgba(190,240,246,.13);
    box-shadow:0 8px 28px rgba(2,14,18,.28);
    opacity:.62; transition:opacity .25s ease;
  }
  #camDock:hover{ opacity:1; }
  #camDock .cam-title{
    font-size:9px; letter-spacing:.30em; text-indent:.30em; text-align:center;
    color:rgba(200,240,234,.45); margin-bottom:2px;
  }
  .cam-pill{
    display:flex; align-items:center; gap:7px; cursor:pointer;
    padding:6px 10px 6px 7px; border-radius:9px;
    border:1px solid transparent; color:rgba(214,242,246,.62);
    font-size:11.5px; line-height:1; user-select:none;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .cam-pill b{
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; border-radius:5px; font-size:9.5px; font-weight:500;
    background:rgba(150,220,232,.14); color:rgba(200,240,246,.72);
  }
  .cam-pill:hover{ background:rgba(150,220,232,.10); color:rgba(226,250,252,.92); }
  .cam-pill.on{
    background:rgba(90,190,210,.20); border-color:rgba(140,225,240,.34);
    color:#e8fbfd;
  }
  .cam-pill.on b{ background:rgba(120,215,232,.34); color:#f2feff; }
  body.bare #camDock{ display:none; }
  @media (max-width:720px){
    #camDock{ left:8px; padding:6px 5px; }
    .cam-pill span{ display:none; }
  }
</style>
</head>
<body>

<canvas id="tank" aria-label="静水桌面海缸"></canvas>
<div class="glass-frame" aria-hidden="true"></div>

<header class="topbar hud">
  <div class="brand">
    <h1>静水<span class="latin">Still Water</span></h1>
    <p class="sub">桌面海缸 · Desktop Reef</p>
  </div>
  <div class="status">
    <div class="counts">
      <span><b id="fishCount">0</b><i>鱼</i></span>
      <span class="sep">·</span>
      <span><b id="crabCount">0</b><i>虾蟹</i></span>
    </div>
    <div class="quality">
      <span class="q-label">水质</span>
      <span class="q-bar"><i id="qFill"></i></span>
      <span class="q-state" id="qState">清澈</span>
    </div>
  </div>
</header>

<div class="hint hud" id="hint">点击水面泛起涟漪 · 双击敲缸 · <kbd>F</kbd> 投食 · <kbd>B</kbd> 气泡 · <kbd>W</kbd> 造流 · <kbd>T</kbd> 换水 · <kbd>H</kbd> 藏起界面</div>

<footer class="dock hud" id="dock" aria-label="互动控制"></footer>

<aside class="drawer hud" id="drawer">
  <div class="drawer-panel" id="drawerPanel">
    <button class="drawer-x" id="drawerClose" aria-label="收起生物抽屉">×</button>
    <div class="drawer-head">
      <h2>生物抽屉</h2>
      <span id="drawerTotal">0 / 48</span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="drawer-foot">点击投放 · 拖到水面任意位置<br>把缸里的鱼拖回这里即可移除</div>
  </div>
  <button class="drawer-tab" id="drawerTab" title="打开生物抽屉">
    <svg viewBox="0 0 24 24"><path d="M3 12c3-4 6.5-6 10-6 3 0 5.5 1.4 7 3.5M3 12c3 4 6.5 6 10 6 3 0 5.5-1.4 7-3.5"/><path d="M20 8.5V12h-3.5"/><circle cx="9" cy="12" r=".9" fill="currentColor" stroke="none"/></svg>
    <span>生物</span><i class="dot"></i>
  </button>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="boot">
  <div class="boot-title">静水</div>
  <div class="boot-word">正在注水</div>
  <div class="boot-bar"><i></i></div>
</div>

<div id="fatal" hidden>
  <h2 id="fatalTitle"></h2>
  <p id="fatalMsg"></p>
  <pre id="fatalDetail"></pre>
</div>

<script>
/* three.js 加载器：CDN 优先，同目录 three.min.js 回退 */
window.__loadThree = function (cb) {
  var urls = ['./three.min.js'];
  var i = 0;
  var finished = false;
  function finish(err) {
    if (finished) return;
    finished = true;
    cb(err);
  }
  function next() {
    if (finished) return;
    if (window.THREE) return finish(null);
    if (i >= urls.length) return finish(new Error('three.js 未能从任何来源加载'));
    var s = document.createElement('script');
    var settled = false;
    var timer = setTimeout(function () {

      /* 探针：自动触发互动（截图验证用） */
      Bus.on('app:ready', function () {
        if (/[?&]foamtest=1/.test(location.search)) {
          const m = new THREE.Mesh(new THREE.CircleGeometry(1.2, 24),
            new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.9 }));
          m.geometry.rotateX(-Math.PI / 2);
          m.position.set(0.6, 0.03, 2.55);
          m.layers.set(1);
          scene.add(m);
        }
        if (/[?&]pour=1/.test(location.search)) setTimeout(pourWater, 300);
        if (/[?&]bubble=1/.test(location.search)) setTimeout(toggleBubbles, 300);
        if (/[?&]flow=1/.test(location.search)) setTimeout(toggleFlow, 500);
        if (/[?&]knock=1/.test(location.search)) {
          setTimeout(function () { doKnock(window.innerWidth * 0.5, window.innerHeight * 0.55); }, 900);
        }
      });

      /* 开场保持镜面，不再自动加涟漪 */

      lastFrame = performance.now() * 0.001;
      requestAnimationFrame(animate);
    } catch (e) {
      showFatal('初始化失败', (e && e.message) || String(e), (e && e.stack) || '');
      console.error(e);
    }
  }

  function showFatal(title, msg, detail) {
    if (fatalShown) return;
    fatalShown = true;
    $('fatalTitle').textContent = title;
    $('fatalMsg').textContent = msg;
    $('fatalDetail').textContent = detail || '';
    $('fatal').hidden = false;
    $('boot').style.display = 'none';
  }

  function initRenderer() {
    canvas = $('tank');
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(state.dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x0a2a33, 1);
    renderer.debug.checkShaderErrors = true;
    renderer.debug.onShaderError = function () {
      showFatal('着色器编译失败', '水面 / 模拟着色器没有通过编译，画面无法继续。请把浏览器控制台里的报错发给我。', '');
    };

    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      showFatal('WebGL 上下文丢失', '浏览器回收了显卡上下文，刷新页面即可恢复。', '');
    }, false);

    /* 半浮点渲染目标支持：需要显式开启扩展 */
    const gl = renderer.getContext();
    if (renderer.capabilities.isWebGL2) {
      gl.getExtension('EXT_color_buffer_float');
    } else {
      gl.getExtension('OES_texture_half_float');
      gl.getExtension('EXT_color_buffer_half_float');
      gl.getExtension('OES_texture_half_float_linear');
    }

    scene = new THREE.Scene();
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 120);
    camPose.tilt = camGoal.tilt = camFrom.tilt = CONFIG.camera.tiltDeg;
    camPose.zoom = camGoal.zoom = camFrom.zoom = 1;
    tilt = THREE.MathUtils.degToRad(camPose.tilt);
    camera.position.set(
      0,
      Math.cos(tilt) * CONFIG.camera.distance,
      Math.sin(tilt) * CONFIG.camera.distance
    );
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
    camera.layers.set(0);
  }

  function initLights() {
    hemi = new THREE.HemisphereLight(0xcdeff0, 0x16333a, 0.9);
    hemi.layers.enable(1);

    dirMain = new THREE.DirectionalLight(0xfff2dc, 1.75);
    dirMain.position.set(4, 12, 5);
    dirMain.layers.enable(1);

    dirFill = new THREE.DirectionalLight(0x9fd7e8, 0.35);
    dirFill.position.set(-7, 6, -5);
    dirFill.layers.enable(1);

    scene.add(hemi, dirMain, dirFill);
  }

  function initFloorTexture() {
    const w = 256, h = 144;
    const data = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const wx = (x + 0.5) / w * CONFIG.tank.w - CONFIG.tank.w / 2;
        const wz = (y + 0.5) / h * CONFIG.tank.d - CONFIG.tank.d / 2;
        const fh = floorHeight(wx, wz);
        const d = clamp((-fh - 0.30) / 1.15, 0, 1);
        const v = Math.round(d * 255);
        const i = (y * w + x) * 4;
        data[i] = v; data[i + 1] = v; data[i + 2] = v; data[i + 3] = 255;
      }
    }
    floorTex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
    floorTex.minFilter = THREE.LinearFilter;
    floorTex.magFilter = THREE.LinearFilter;
    floorTex.needsUpdate = true;
  }

  function initShadowTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 3, 64, 64, 63);
    g.addColorStop(0, 'rgba(0,0,0,0.60)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.26)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    shadowTex = new THREE.CanvasTexture(c);
    shadowTex.minFilter = THREE.LinearFilter;
  }

  /* ---------- 砂床 ---------- */

  function initSandTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(256, 256);
    for (let i = 0; i < 256 * 256; i++) {
      let v = 232 + Math.random() * 23;
      if (Math.random() < 0.018) v -= 26 + Math.random() * 30;
      const j = i * 4;
      img.data[j] = v;
      img.data[j + 1] = v - 2;
      img.data[j + 2] = v - 5;
      img.data[j + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(9, 5.2);
    tex.minFilter = THREE.LinearMipMapLinearFilter;
    tex.anisotropy = 4;
    return tex;
  }

  function buildSand() {
    const W = CONFIG.tank.w, D = CONFIG.tank.d;
    const geo = new THREE.PlaneGeometry(W, D, 200, 112);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cA = new THREE.Color(0xd9c9a4);
    const cB = new THREE.Color(0xc2ae86);
    const cC = new THREE.Color(0x9a8666);
    const tmp = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const h = floorHeight(x, z);
      pos.setY(i, h);
      const n = fbm(x * 0.8 + 5.0, z * 0.8 - 3.0, 3);
      tmp.copy(cA).lerp(cB, n).lerp(cC, Math.max(0, -h - 1.02) * 0.5);
      colors[i * 3] = tmp.r;
      colors[i * 3 + 1] = tmp.g;
      colors[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      map: sandTexture,
      roughness: 0.96,
      metalness: 0.0
    });
    sandMesh = new THREE.Mesh(geo, mat);
    sandMesh.layers.set(0);
    scene.add(sandMesh);
  }

  function addShadow(parent, x, z, r, opacity) {
    const geo = new THREE.PlaneGeometry(r * 2, r * 2);
    const mat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      color: 0x061719,
      transparent: true,
      opacity: opacity,
      depthWrite: false
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, floorHeight(x, z) + 0.014, z);
    m.renderOrder = 2;
    parent.add(m);
    return m;
  }

  /* ---------- 岩石 ---------- */

  function makeRock(seed, radius, color) {
    const geo = new THREE.SphereGeometry(1, 24, 16);
    const rng = mulberry32(seed);
    const off = rng() * 40;
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    const baseColor = new THREE.Color(color);
    const shadeColor = new THREE.Color();
    const colors = new Float32Array(pos.count * 3);

    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = fbm(v.x * 1.6 + off, v.z * 1.6 + off, 3) * 0.66
        + fbm(v.y * 3.1 - off, v.x * 3.1 + off, 2) * 0.34;
      const ridge = 1.0 - Math.abs(fbm(v.x * 4.2 - off, v.z * 4.2 + off, 2) * 2.0 - 1.0);
      const rr = 0.70 + n * 0.55 + ridge * 0.10;
      v.multiplyScalar(rr);
      v.y *= 0.78;
      pos.setXYZ(i, v.x, v.y, v.z);

      const moss = fbm(v.x * 3.4 + off * 1.3, v.z * 3.4 - off, 3);
      shadeColor.copy(baseColor).multiplyScalar(0.72 + moss * 0.62);
      colors[i * 3] = shadeColor.r;
      colors[i * 3 + 1] = shadeColor.g;
      colors[i * 3 + 2] = shadeColor.b;
    }
    geo.computeVertexNormals();
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      vertexColors: true,
      roughness: 0.94,
      metalness: 0.0,
      flatShading: true
    });
    const m = new THREE.Mesh(geo, mat);
    m.scale.setScalar(radius);
    return m;
  }

  /* ---------- 珊瑚 ---------- */

  function addBrainCoral(parent, x, z, r, seed) {
    const rng = mulberry32(seed);
    const geo = new THREE.SphereGeometry(1, 40, 28);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = fbm(v.x * 3.2 + 7.0, v.z * 3.2 - 2.0, 3);
      const ridge = 0.07 * Math.sin(v.x * 11.0 + v.y * 9.0 + n * 7.0);
      v.multiplyScalar(1 + (n - 0.5) * 0.14 + ridge);
      v.y = Math.max(v.y * 0.62, -0.25);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: 0xe8b050,
      roughness: 0.78,
      flatShading: true
    });
    const m = new THREE.Mesh(geo, mat);
    m.scale.set(r, r * 0.86, r * 0.92);
    m.position.set(x, floorHeight(x, z) + r * 0.14, z);
    m.rotation.y = rng() * 6.28;
    parent.add(m);
    addShadow(parent, x, z, r * 1.5, 0.45);
  }

  function addStaghorn(parent, x, z, seed) {
    const rng = mulberry32(seed);
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xe07aa8, roughness: 0.7 });
    const n = 7;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rng() * 0.7;
      const h = 0.70 + rng() * 0.60;
      const pts = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(Math.cos(a) * 0.12, h * 0.42, Math.sin(a) * 0.12),
        new THREE.Vector3(Math.cos(a + 0.4) * 0.24, h * 0.78, Math.sin(a + 0.4) * 0.24),
        new THREE.Vector3(Math.cos(a + 0.85) * 0.30, h, Math.sin(a + 0.85) * 0.30)
      ];
      const curve = new THREE.CatmullRomCurve3(pts);
      const tube = new THREE.TubeGeometry(curve, 12, 0.032, 5, false);
      g.add(new THREE.Mesh(tube, mat));
    }
    g.position.set(x, floorHeight(x, z), z);
    parent.add(g);
    addShadow(parent, x, z, 0.7, 0.38);
  }

  function addBubbleCoral(parent, x, z, seed) {
    const rng = mulberry32(seed);
    const g = new THREE.Group();
    const geo = new THREE.SphereGeometry(1, 12, 10);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x7fe0c0, roughness: 0.42, metalness: 0.0
    });
    const n = 26;
    const inst = new THREE.InstancedMesh(geo, mat, n);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < n; i++) {
      const a = rng() * Math.PI * 2;
      const rad = Math.sqrt(rng()) * 0.38;
      const s = 0.055 + rng() * 0.070;
      dummy.position.set(Math.cos(a) * rad, 0.02 + s * 0.6, Math.sin(a) * rad);
      dummy.scale.setScalar(s);
      dummy.rotation.set(rng() * 3, rng() * 3, rng() * 3);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    g.add(inst);
    g.position.set(x, floorHeight(x, z) + 0.02, z);
    parent.add(g);
    addShadow(parent, x, z, 0.62, 0.36);
  }

  /* ---------- 海葵 ---------- */

  function addAnemone(parent, x, z, color, seed) {
    const rng = mulberry32(seed);
    const g = new THREE.Group();
    g.position.set(x, floorHeight(x, z) + 0.02, z);

    const baseColor = new THREE.Color(color).multiplyScalar(0.72);
    const baseMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.85 });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.24, 0.09, 16), baseMat);
    base.position.y = 0.045;
    g.add(base);

    const tentGeo = new THREE.ConeGeometry(0.013, 0.28, 5);
    tentGeo.translate(0, 0.14, 0);
    const tentMat = new THREE.MeshStandardMaterial({
      color: color, roughness: 0.55, emissive: new THREE.Color(color), emissiveIntensity: 0.05
    });

    const count = 26;
    const inst = new THREE.InstancedMesh(tentGeo, tentMat, count);
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const items = [];
    for (let i = 0; i < count; i++) {
      const a = rng() * Math.PI * 2;
      const rad = 0.035 + Math.sqrt(rng()) * 0.155;
      items.push({
        x: Math.cos(a) * rad,
        z: Math.sin(a) * rad,
        ax: (rng() - 0.5) * 0.55,
        az: (rng() - 0.5) * 0.55,
        ph: rng() * 6.283,
        sp: 0.8 + rng() * 0.7
      });
    }
    g.add(inst);
    parent.add(g);
    anemones.push({ inst: inst, items: items });
    addShadow(parent, x, z, 0.5, 0.34);
  }

  /* ---------- 海星 / 海胆 / 贝壳 ---------- */

  function addStarfish(parent, x, z, seed) {
    const rng = mulberry32(seed);
    const shape = new THREE.Shape();
    const arms = 5, R = 0.30, r0 = 0.105;
    for (let i = 0; i <= 160; i++) {
      const a = (i / 160) * Math.PI * 2;
      const k = (1 + Math.cos(arms * a)) * 0.5;
      const rr = r0 + (R - r0) * Math.pow(k, 0.72);
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) shape.moveTo(px, py); else shape.lineTo(px, py);
    }
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: 0.045, bevelEnabled: true, bevelThickness: 0.012,
      bevelSize: 0.012, bevelSegments: 1, steps: 1
    });
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshStandardMaterial({ color: 0xd9824a, roughness: 0.8, flatShading: true });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, floorHeight(x, z) + 0.035, z);
    m.rotation.y = rng() * 6.28;
    parent.add(m);
    addShadow(parent, x, z, 0.42, 0.4);
  }

  function addUrchin(parent, x, z, seed) {
    const rng = mulberry32(seed);
    const g = new THREE.Group();
    g.position.set(x, floorHeight(x, z) + 0.14, z);

    const body = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0x2a1f2b, roughness: 0.7 })
    );
    g.add(body);

    const spikeGeo = new THREE.ConeGeometry(0.011, 0.19, 4);
    spikeGeo.translate(0, 0.095, 0);
    const spikeMat = new THREE.MeshStandardMaterial({ color: 0x3a2b3b, roughness: 0.6 });
    const count = 44;
    const inst = new THREE.InstancedMesh(spikeGeo, spikeMat, count);
    const dummy = new THREE.Object3D();
    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    const q = new THREE.Quaternion();

    for (let i = 0; i < count; i++) {
      const u = rng() * 2 - 1;
      const a = rng() * Math.PI * 2;
      const rr = Math.sqrt(1 - u * u);
      dir.set(Math.cos(a) * rr, u, Math.sin(a) * rr).normalize();
      q.setFromUnitVectors(up, dir);
      dummy.position.copy(dir).multiplyScalar(0.115);
      dummy.quaternion.copy(q);
      dummy.scale.setScalar(0.8 + rng() * 0.5);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    g.add(inst);
    parent.add(g);
    addShadow(parent, x, z, 0.4, 0.32);
  }

  function addShell(parent, x, z, seed) {
    const rng = mulberry32(seed);
    const geo = new THREE.ConeGeometry(0.075, 0.11, 8);
    geo.rotateZ(Math.PI * 0.5);
    const mat = new THREE.MeshStandardMaterial({ color: 0xe9dcc4, roughness: 0.55, flatShading: true });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, floorHeight(x, z) + 0.05, z);
    m.rotation.y = rng() * 6.28;
    m.rotation.x = (rng() - 0.5) * 0.25;
    parent.add(m);
  }

  /* ---------- 沉木 ---------- */

  function addWood(parent, points, radius, color) {
    const curve = new THREE.CatmullRomCurve3(points);
    const geo = new THREE.TubeGeometry(curve, 26, radius, 7, false);
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.88, flatShading: false });
    const m = new THREE.Mesh(geo, mat);
    parent.add(m);
    return m;
  }

  /* ---------- 浮萍 ---------- */

  function makeLeafGeometry() {
    const shape = new THREE.Shape();
    const notch = 0.34;
    shape.moveTo(0, 0);
    shape.absarc(0, 0, 1, notch, Math.PI * 2 - notch, false);
    shape.lineTo(0, 0);
    const geo = new THREE.ShapeGeometry(shape, 14);
    geo.rotateX(-Math.PI / 2);
    geo.scale(1.0, 1.0, 0.82);
    return geo;
  }

  function addDuckweed(parent, seed) {
    const rng = mulberry32(seed);
    const geo = makeLeafGeometry();

    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x24462a, roughness: 0.92, side: THREE.DoubleSide
    });
    const lightMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.72, side: THREE.DoubleSide
    });

    /* 成片分布：几处浮萍群 + 少量零散叶，而不是只堆在晒台旁 */
    const clusters = [
      { x: -4.55, z: -1.90, r: 0.34, n: 14 },
      { x: 1.35, z: 2.65, r: 0.30, n: 12 },
      { x: 5.15, z: -1.25, r: 0.28, n: 10 },
      { x: -2.20, z: -2.85, r: 0.26, n: 10 },
      { x: 3.50, z: 1.00, r: 0.24, n: 8 },
      { x: -1.00, z: 3.20, r: 0.22, n: 7 },
      { x: 6.00, z: 2.25, r: 0.20, n: 6 },
      { x: -5.30, z: 2.50, r: 0.20, n: 6 },
      { x: 0.35, z: 0.55, r: 0.22, n: 6 }
    ];

    const leaves = [];
    const hw = CONFIG.tank.w / 2 - 0.3;
    const hd = CONFIG.tank.d / 2 - 0.3;

    const canPlace = function (x, z) {
      if (Math.abs(x) > hw || Math.abs(z) > hd) return false;
      if (Math.hypot(x - SCENERY_LAYOUT.platform.x, z - SCENERY_LAYOUT.platform.z) < 2.15) return false;
      for (let ri = 0; ri < SCENERY_LAYOUT.rocks.length; ri++) {
        const rk = SCENERY_LAYOUT.rocks[ri];
        if (Math.hypot(x - rk.x, z - rk.z) < rk.r * 0.95) return false;
      }
      return true;
    };

    const pushLeaf = function (x, z, dir, speed) {
      leaves.push({
        x: x, z: z,
        s: 0.060 + rng() * 0.040,
        rot: rng() * 6.283,
        ph: rng() * 6.283,
        vx: Math.cos(dir) * speed,
        vz: Math.sin(dir) * speed,
        tone: rng()
      });
    };

    for (let ci = 0; ci < clusters.length; ci++) {
      const c = clusters[ci];
      const dir = rng() * Math.PI * 2;
      const speed = 0.010 + rng() * 0.014;
      for (let i = 0; i < c.n; i++) {
        const a = rng() * Math.PI * 2;
        const rad = Math.sqrt(rng()) * c.r;
        const x = c.x + Math.cos(a) * rad;
        const z = c.z + Math.sin(a) * rad;
        if (canPlace(x, z)) pushLeaf(x, z, dir, speed);
      }
    }

    /* 零散叶：让浮萍不只在几个点上 */
    for (let i = 0; i < 8; i++) {
      const x = (rng() * 2 - 1) * (hw - 0.4);
      const z = (rng() * 2 - 1) * (hd - 0.4);
      if (canPlace(x, z)) pushLeaf(x, z, rng() * Math.PI * 2, 0.008 + rng() * 0.012);
    }

    const n = leaves.length;
    duckWeedDark = new THREE.InstancedMesh(geo, darkMat, n);
    duckWeeds = new THREE.InstancedMesh(geo, lightMat, n);
    duckWeedDark.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    duckWeeds.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    duckWeedDark.frustumCulled = false;
    duckWeeds.frustumCulled = false;

    if (duckWeeds.setColorAt) {
      for (let i = 0; i < n; i++) {
        const tone = leaves[i].tone;
        const col = new THREE.Color().setHSL(0.295 + tone * 0.040, 0.50, 0.36 + tone * 0.12);
        duckWeeds.setColorAt(i, col);
      }
      if (duckWeeds.instanceColor) duckWeeds.instanceColor.needsUpdate = true;
    }

    duckWeedData = leaves;
    parent.add(duckWeedDark);
    parent.add(duckWeeds);
  }

  /* ---------- 造景总装（注册表驱动，可一键重排） ---------- */

  function buildScenery(seed) {
    if (sceneryRoot) {
      scene.remove(sceneryRoot);
      disposeTree(sceneryRoot);
    }
    if (surfaceRoot) {
      scene.remove(surfaceRoot);
      disposeTree(surfaceRoot);
    }
    if (depthRoot) {
      scene.remove(depthRoot);
      disposeTree(depthRoot);
    }

    sceneryRoot = new THREE.Group();
    surfaceRoot = new THREE.Group();
    depthRoot = new THREE.Group();
    scene.add(sceneryRoot);
    scene.add(surfaceRoot);
    scene.add(depthRoot);
    anemones = [];
    duckWeeds = null;
    duckWeedDark = null;
    duckWeedData = [];
    algaeList.length = 0;
    spareShells.length = 0;

    const rng = mulberry32(seed);
    const L = SCENERY_LAYOUT;
    const jitter = (amount) => (rng() - 0.5) * amount;

    /* 左上角露出水面的晒台 */
    const plat = makeRock(seed + 7, 1.0, 0x3e3a33);
    plat.scale.set(1.55, 0.55, 1.30);
    plat.position.set(L.platform.x, -0.46, L.platform.z);
    plat.rotation.y = 0.6;
    surfaceRoot.add(plat);

    const platTop = makeRock(seed + 8, 1.0, 0x484338);
    platTop.scale.set(0.62, 0.36, 0.55);
    platTop.position.set(L.platform.x + 0.55, -0.02, L.platform.z + 0.18);
    platTop.rotation.y = 2.1;
    surfaceRoot.add(platTop);

    addShadow(sceneryRoot, L.platform.x, L.platform.z, 2.0, 0.40);

    /* 晒台水线：一圈深色湿痕 */
    const ringGeo = new THREE.RingGeometry(1.86, 2.10, 48);
    ringGeo.rotateX(-Math.PI / 2);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0x06120f, transparent: true, opacity: 0.22, depthWrite: false
    }));
    ring.position.set(L.platform.x, 0.008, L.platform.z);
    ring.scale.set(1.0, 1.0, 0.84);
    surfaceRoot.add(ring);

    /* 不再放置悬浮沉木：等 M2 有鱼之后再考虑水下倒木的位置 */

    /* 活石 / 青龙石 */
    const proxyMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });
    if (!algaeGeo) {
      algaeGeo = new THREE.CircleGeometry(1, 14);
      algaeGeo.rotateX(-Math.PI / 2);
      SHARED_GEOS.add(algaeGeo);
    }
    for (let i = 0; i < L.rocks.length; i++) {
      const r = L.rocks[i];
      const x = r.x + jitter(0.8);
      const z = r.z + jitter(0.8);
      const radius = r.r * (0.88 + rng() * 0.24);
      const rock = makeRock(seed + 20 + i * 7, radius, r.c);
      rock.position.set(x, floorHeight(x, z) - radius * 0.30, z);
      rock.rotation.y = rng() * 6.28;
      rock.rotation.z = (rng() - 0.5) * 0.10;
      sceneryRoot.add(rock);
      addShadow(sceneryRoot, x, z, radius * 1.05, 0.38);

      /* 只写深度的岩石代理：让水面层的鱼被石头正确遮挡 */
      const proxy = new THREE.Mesh(rock.geometry, proxyMat);
      proxy.position.copy(rock.position);
      proxy.rotation.copy(rock.rotation);
      proxy.scale.copy(rock.scale);
      proxy.layers.set(1);
      proxy.renderOrder = -10;
      proxy.frustumCulled = false;
      depthRoot.add(proxy);

      /* 石顶藻斑：被啃食会缩小，水质差加速生长 */
      if (radius > 0.68 && algaeList.length < 12) {
        const n = radius > 1.1 ? 2 : 1;
        for (let k = 0; k < n; k++) {
          const aa = rng() * 6.283;
          const rr = rng() * radius * 0.45;
          const px = x + Math.cos(aa) * rr;
          const pz = z + Math.sin(aa) * rr;
          const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.27 + rng() * 0.06, 0.44, 0.24),
            roughness: 0.95, transparent: true, opacity: 0.4, depthWrite: false
          });
          const m = new THREE.Mesh(algaeGeo, mat);
          m.position.set(px, floorHeight(px, pz) + radius * 0.22 + 0.03, pz);
          m.rotation.y = rng() * 6.283;
          const base = radius * (0.20 + rng() * 0.14);
          const size = 0.15 + rng() * 0.3;
          m.scale.setScalar(base * (0.22 + 0.78 * size));
          sceneryRoot.add(m);
          algaeList.push({ mesh: m, x: px, z: pz, size: size, base: base });
        }
      }
    }

    /* 珊瑚：按注册表类型分发 */
    for (let i = 0; i < L.corals.length; i++) {
      const c = L.corals[i];
      const cx = c.x + jitter(0.4);
      const cz = c.z + jitter(0.4);
      if (c.type === 'brain') addBrainCoral(sceneryRoot, cx, cz, 0.58, seed + 41 + i * 3);
      else if (c.type === 'staghorn') addStaghorn(sceneryRoot, cx, cz, seed + 42 + i * 3);
      else if (c.type === 'bubble') addBubbleCoral(sceneryRoot, cx, cz, seed + 43 + i * 3);
    }

    /* 海葵 */
    for (let i = 0; i < L.anemones.length; i++) {
      const a = L.anemones[i];
      addAnemone(sceneryRoot, a.x + jitter(0.3), a.z + jitter(0.3), a.c, seed + 60 + i);
    }

    /* 底栖小生物 */
    addStarfish(sceneryRoot, L.starfish.x + jitter(0.4), L.starfish.z + jitter(0.3), seed + 71);
    addUrchin(sceneryRoot, L.urchin.x + jitter(0.4), L.urchin.z + jitter(0.3), seed + 72);
    for (let i = 0; i < L.shells.length; i++) {
      addShell(sceneryRoot, L.shells[i].x + jitter(0.5), L.shells[i].z + jitter(0.4), seed + 80 + i);
    }

    /* 寄居蟹备用空壳 */
    for (let i = 0; i < L.hermitShells.length; i++) {
      const s = L.hermitShells[i];
      const sx = s.x + jitter(0.3), sz = s.z + jitter(0.3);
      const m = makeSpareShellMesh(s.s);
      m.position.set(sx, floorHeight(sx, sz) + 0.015, sz);
      m.rotation.y = rng() * 6.283;
      sceneryRoot.add(m);
      spareShells.push({ x: sx, z: sz, size: s.s, mesh: m, occupied: false, owner: null });
    }

    /* 浮萍：成片点缀在水面各处 */
    addDuckweed(surfaceRoot, seed + 91);

    /* 分层：0 = 水下（进折射 RT），1 = 水面以上（合成之后画） */
    setLayer(sceneryRoot, 0);
    setLayer(surfaceRoot, 1);

    /* 记录到事件总线，方便后续插件挂钩 */
    Bus.emit('scenery:built', { seed: seed });
  }

  function setLayer(root, n) {
    root.traverse(function (o) { o.layers.set(n); });
  }

  /* 共享几何（藻斑 / 备用壳）：重排造景时不能误销毁 */
  const SHARED_GEOS = new Set();

  function disposeTree(root) {
    root.traverse(function (o) {
      if (o.geometry && !SHARED_GEOS.has(o.geometry)) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (let i = 0; i < mats.length; i++) mats[i].dispose();
      }
    });
  }

  /* =========================================================================
     ③ GPU 水体：高度场 ping-pong + 表面合成
     ========================================================================= */

  const SIM_VERT = [
    'varying vec2 vUv;',
    'void main(){',
    '  vUv = uv;',
    '  gl_Position = vec4(position.xy, 0.0, 1.0);',
    '}'
  ].join('\n');

  const SIM_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    'uniform sampler2D uState;',
    'uniform vec2 uTexel;',
    'uniform vec2 uTank;',
    'uniform float uC;',
    'uniform float uDamping;',
    'uniform float uCalm;',
    'uniform vec4 uImpulses[8];',
    '',
    'float H(vec2 uv){ return texture2D(uState, clamp(uv, 0.0, 1.0)).r; }',
    '',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec4 s = texture2D(uState, uv);',
    '  float h = s.r;',
    '  float hp = s.g;',
    '',
    '  float lap = H(uv + vec2(uTexel.x, 0.0)) + H(uv - vec2(uTexel.x, 0.0))',
    '            + H(uv + vec2(0.0, uTexel.y)) + H(uv - vec2(0.0, uTexel.y)) - 4.0 * h;',
    '',
    '  float hn = (2.0 * h - hp) + uC * lap;',
    '  hn *= uDamping;',
    '',
    '  for (int i = 0; i < 8; i++){',
    '    vec4 im = uImpulses[i];',
    '    if (im.w > 0.0){',
    '      vec2 d = (uv - im.xy) * uTank;',
    '      hn += im.z * exp(-dot(d, d) / im.w);',
    '    }',
    '  }',
    '',
    '  float avg = (H(uv + vec2(uTexel.x, 0.0)) + H(uv - vec2(uTexel.x, 0.0))',
    '            + H(uv + vec2(0.0, uTexel.y)) + H(uv - vec2(0.0, uTexel.y))) * 0.25;',
    '  hn = mix(hn, avg, 0.02);',
    '',
    '  float edge = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));',
    '  hn *= mix(0.55, 1.0, smoothstep(0.0, 0.10, edge));',
    '',
    '  float keep = mix(1.0, 0.93, uCalm);',
    '  hn *= keep;',
    '  h *= keep;',
    '',
    '  gl_FragColor = vec4(hn, h, 0.0, 1.0);',
    '}'
  ].join('\n');

  const WATER_VERT = [
    'varying vec2 vUv;',
    'void main(){',
    '  vUv = uv;',
    '  gl_Position = vec4(position.xy, 0.0, 1.0);',
    '}'
  ].join('\n');

  const WATER_FRAG = [
    'precision highp float;',
    'varying vec2 vUv;',
    '',
    'uniform sampler2D uScene;',
    'uniform sampler2D uSim;',
    'uniform sampler2D uFloor;',
    'uniform vec2 uOrigin;',
    'uniform vec2 uViewX;',
    'uniform vec2 uViewY;',
    'uniform vec2 uTank;',
    'uniform vec2 uSimTexel;',
    'uniform float uTime;',
    'uniform float uNight;',
    'uniform float uCalm;',
    'uniform float uNormalScale;',
    'uniform float uRefract;',
    'uniform float uCaustic;',
    'uniform float uGlint;',
    'uniform vec3 uShallow;',
    'uniform vec3 uDeep;',
    'uniform vec3 uSkyA;',
    'uniform vec3 uSkyB;',
    'uniform vec3 uGlass;',
    'uniform vec3 uCausticCol;',
    'uniform float uMurk;',
    'uniform float uRaw;',
    '',
    'float hash21(vec2 p){',
    '  p = fract(p * vec2(123.34, 456.21));',
    '  p += dot(p, p + 45.32);',
    '  return fract(p.x * p.y);',
    '}',
    '',
    'float vnoise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash21(i);',
    '  float b = hash21(i + vec2(1.0, 0.0));',
    '  float c = hash21(i + vec2(0.0, 1.0));',
    '  float d = hash21(i + vec2(1.0, 1.0));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    '',
    'float caustic(vec2 p, float t){',
    '  p *= 3.4;',
    '  float a = sin(p.x * 1.55 + t * 0.55 + sin(p.y * 1.35 + t * 0.30));',
    '  float b = sin(p.y * 1.85 - t * 0.50 + sin(p.x * 1.70 - t * 0.25));',
    '  float v = 1.0 - abs(a * b);',
    '  v = clamp(v, 0.0, 1.0);',
    '  return pow(v, 8.0);',
    '}',
    '',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec2 world = uOrigin + uViewX * uv.x + uViewY * uv.y;',
    '  vec2 suv = clamp(world / uTank + 0.5, 0.0, 1.0);',
    '',
    '  float hL = texture2D(uSim, clamp(suv - vec2(uSimTexel.x, 0.0), 0.0, 1.0)).r;',
    '  float hR = texture2D(uSim, clamp(suv + vec2(uSimTexel.x, 0.0), 0.0, 1.0)).r;',
    '  float hD = texture2D(uSim, clamp(suv - vec2(0.0, uSimTexel.y), 0.0, 1.0)).r;',
    '  float hU = texture2D(uSim, clamp(suv + vec2(0.0, uSimTexel.y), 0.0, 1.0)).r;',
    '',
    '  float ns = uNormalScale * (1.0 - 0.82 * uCalm);',
    '  vec3 N = normalize(vec3((hL - hR) * ns, 1.0, (hD - hU) * ns));',
    '',
    '  float depth = clamp(texture2D(uFloor, suv).r, 0.0, 1.0);',
    '',
    '  vec2 off = N.xz * uRefract * (0.35 + 0.65 * depth);',
    '  vec3 scn = texture2D(uScene, clamp(uv + off, vec2(0.0015), vec2(0.9985))).rgb;',
    '  if (uRaw > 0.5) { gl_FragColor = vec4(scn, 1.0); return; }',
    '',
    '  vec3 lin = pow(max(scn, 0.0), vec3(2.2));',
    '',
    '  float dk = pow(clamp(depth, 0.0, 1.0), 2.0);',
    '  vec3 waterTint = mix(vec3(0.55, 0.95, 1.05), vec3(0.02, 0.08, 0.45), dk);',
    '  lin *= waterTint * 1.70;',
    '  lin += mix(vec3(0.010, 0.050, 0.060), vec3(0.002, 0.010, 0.030), dk);',
    '',
    '  /* 水质浑浊：绿灰化 + 悬浮微粒 */',
    '  float mk = uMurk;',
    '  lin = mix(lin, lin * vec3(0.34, 0.42, 0.24) * 1.7, mk * 0.55);',
    '  float nA = vnoise(world * 5.2 + vec2(uTime * 0.055, -uTime * 0.045));',
    '  float nB = vnoise(world * 12.5 - vec2(uTime * 0.095, uTime * 0.075));',
    '  float fleck = smoothstep(0.50, 0.95, nA * 0.72 + nB * 0.28);',
    '  lin += vec3(0.24, 0.33, 0.17) * fleck * mk * 0.40;',
    '  float lumM = dot(lin, vec3(0.30, 0.60, 0.10));',
    '  lin = mix(vec3(lumM), lin, 1.0 - mk * 0.45);',
    '',
    '  vec2 cw = world + N.xz * 0.35;',
    '  float c = caustic(cw, uTime * 0.50);',
    '  float c2 = caustic(cw * 1.27 + vec2(5.7, -3.1), uTime * 0.37);',
    '  c = c * 0.60 + c2 * 0.40;',
    '  float cMask = 0.55 + 0.45 * sin(world.x * 0.22 + uTime * 0.05) * sin(world.y * 0.27 - uTime * 0.04);',
    '  c *= cMask * (0.40 + 0.60 * dk) * (1.0 - 0.65 * mk);',
    '  lin += uCausticCol * c * uCaustic;',
    '',
    '  vec3 V = normalize(vec3(0.0, 0.985, 0.17));',
    '  vec3 L = normalize(vec3(-0.28, 0.92, -0.26));',
    '  float spec = pow(max(dot(reflect(-L, N), V), 0.0), 110.0);',
    '  float sheen = pow(max(dot(reflect(-L, N), V), 0.0), 28.0) * 0.0;',
    '  float spark = step(0.94, hash21(floor(world * 70.0) + floor(uTime * 7.0)));',
    '  lin += uCausticCol * (spec * spark * uGlint * (1.0 - 0.8 * mk) + sheen);',
    '',
    '  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.2);',
    '  vec3 sky = pow(mix(uSkyA, uSkyB, smoothstep(-0.55, 0.55, world.y / 4.5)), vec3(2.2));',
    '  lin = mix(lin, sky, fres * 0.030);',,
    '',
    '  float ex = smoothstep(0.0, 0.055, min(uv.x, 1.0 - uv.x));',
    '  float ey = smoothstep(0.0, 0.070, min(uv.y, 1.0 - uv.y));',
    '  float edge = pow(1.0 - min(ex, ey), 1.5);',
    '  float wet = hash21(vec2(uv.x * 80.0, uv.y * 2.0 + uTime * 0.03));',
    '  lin = mix(lin, pow(uGlass, vec3(2.2)), edge * (0.30 + 0.14 * wet));',
    '',
    '  float vig = smoothstep(1.15, 0.35, length((uv - 0.5) * vec2(1.10, 1.00)) * 1.55);',
    '  lin *= mix(0.90, 1.0, vig);',
    '',
    '  vec3 outCol = pow(clamp(lin, 0.0, 1.0), vec3(0.4545));',
    '  float lum = dot(outCol, vec3(0.299, 0.587, 0.114));',
    '  outCol = mix(vec3(lum), outCol, 1.38);',
    '  outCol = clamp(outCol * outCol * (3.0 - 2.0 * outCol) * 1.08, 0.0, 1.0);',
    '  gl_FragColor = vec4(outCol, 1.0);',
    '}'
  ].join('\n');

  function initWater() {
    const simW = CONFIG.water.simW;
    const simH = CONFIG.water.simH;

    simMat = new THREE.ShaderMaterial({
      uniforms: {
        uState: { value: null },
        uTexel: { value: new THREE.Vector2(1 / simW, 1 / simH) },
        uTank: { value: new THREE.Vector2(CONFIG.tank.w, CONFIG.tank.d) },
        uC: { value: CONFIG.water.c2 },
        uDamping: { value: CONFIG.water.damping },
        uCalm: { value: 0 },
        uImpulses: { value: [
          new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(),
          new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()
        ] }
      },
      vertexShader: SIM_VERT,
      fragmentShader: SIM_FRAG,
      depthTest: false,
      depthWrite: false
    });

    quadSimScene = new THREE.Scene();
    quadSimCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat);
    q.frustumCulled = false;
    quadSimScene.add(q);

    simA = makeSimTarget();
    simB = makeSimTarget();

    waterMat = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      vertexShader: WATER_VERT,
      fragmentShader: WATER_FRAG,
      depthTest: false,
      depthWrite: false
    });

    waterScene = new THREE.Scene();
    waterCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    waterMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waterMat);
    waterMesh.frustumCulled = false;
    waterScene.add(waterMesh);

    waterUniforms.uSim.value = simA.texture;
    waterUniforms.uFloor.value = floorTex;
    waterUniforms.uTank.value = new THREE.Vector2(CONFIG.tank.w, CONFIG.tank.d);
    waterUniforms.uSimTexel.value = new THREE.Vector2(1 / simW, 1 / simH);
    waterUniforms.uOrigin.value = new THREE.Vector2(-8, 4.5);
    waterUniforms.uViewX.value = new THREE.Vector2(16, 0);
    waterUniforms.uViewY.value = new THREE.Vector2(0, -9);
    waterUniforms.uShallow.value = new THREE.Color();
    waterUniforms.uDeep.value = new THREE.Color();
    waterUniforms.uSkyA.value = new THREE.Color();
    waterUniforms.uSkyB.value = new THREE.Color();
    waterUniforms.uGlass.value = new THREE.Color();
    waterUniforms.uCausticCol.value = new THREE.Color();
  }

  function makeSimTarget() {
    return new THREE.WebGLRenderTarget(CONFIG.water.simW, CONFIG.water.simH, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
      depthBuffer: false,
      stencilBuffer: false,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping
    });
  }

  function addRipple(x, z, strength, radius) {
    if (pendingRipples.length > 24) return;
    const u = clamp(x / CONFIG.tank.w + 0.5, 0.02, 0.98);
    const v = clamp(z / CONFIG.tank.d + 0.5, 0.02, 0.98);
    pendingRipples.push({ u: u, v: v, s: strength, r: radius });
    recentRipples.push({ x: x, z: z, s: strength, t0: state.time });
    if (recentRipples.length > 24) recentRipples.shift();
  }

  function simStep() {
    const arr = simMat.uniforms.uImpulses.value;
    for (let i = 0; i < 8; i++) {
      const p = pendingRipples[i];
      if (p) arr[i].set(p.u, p.v, p.s, p.r * p.r);
      else arr[i].set(0, 0, 0, 0);
    }
    pendingRipples.splice(0, 8);

    simMat.uniforms.uState.value = simA.texture;
    simMat.uniforms.uCalm.value = state.calmMix;

    renderer.setRenderTarget(simB);
    renderer.render(quadSimScene, quadSimCamera);
    renderer.setRenderTarget(null);

    const t = simA; simA = simB; simB = t;
    waterUniforms.uSim.value = simA.texture;
  }

  function initRenderTargets() {
    sceneRT = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });
    waterUniforms.uScene.value = sceneRT.texture;
  }

  /* =========================================================================
     ④ 行为系统（M1 只搭骨架：权重选择 + 事件总线订阅）
     ========================================================================= */

  const Behavior = {
    /* 按权重挑选一个行为名；后续物种配置直接复用 */
    choose(weights, rnd) {
      let total = 0;
      for (const k in weights) total += Math.max(0, weights[k]);
      if (total <= 0) return null;
      let r = (rnd || Math.random)() * total;
      for (const k in weights) {
        const w = Math.max(0, weights[k]);
        if (r < w) return k;
        r -= w;
      }
      return null;
    }
  };

  /* =========================================================================
     ④b 鱼类系统（M3 · 重建）
     ----------------------------------------------------------------------
     设计原则：

  const FISH_VISUAL = {};
  for (const fid in FISH_SHAPE) {
    const s = FISH_SHAPE[fid];
    FISH_VISUAL[fid] = {
      len: s.len, wid: s.wMax, speed: s.speed, scale: 1,
      wave: s.wave, hr: s.hTop / Math.max(1e-6, s.wMax)
    };
  }

  const FISH_MAX = 32;
  const INVERT_MAX = 8;
  const TANG_PATH = [
    { x: -5.4, z: -2.5 }, { x: -1.6, z: -3.1 }, { x: 3.0, z: -2.2 },
    { x: 6.2, z: 0.2 }, { x: 3.4, z: 2.8 }, { x: -2.6, z: 2.9 },
    { x: -6.2, z: 1.0 }, { x: -6.6, z: -1.2 }
  ];

  /* 轮廓插值 */
  function profLerp(pts, t) {
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i][0]) {
        const a = pts[i - 1], b = pts[i];
        return a[1] + (b[1] - a[1]) * smooth((t - a[0]) / (b[0] - a[0]));
      }
    }
    return pts[pts.length - 1][1];
  }

  function topAt(s, t) { return s.hTop * profLerp(BODY_TPL.top, t); }
  function botAt(s, t) { return s.hBot * profLerp(BODY_TPL.bot, t); }

  /* ---- 身体：沿体轴扫掠，截面为带脊线的超椭圆 ---- */
  function buildFishBodyGeo(shape) {
    const s = shape;
    const L = s.len;
    const M = 76, N = 36;
    const pos = [], uv = [], idx = [];
    const zN = L * 0.5, zT = -L * 0.5;
    const nTop = 2.35, nBot = 2.15;

    for (let i = 0; i <= M; i++) {
      const t = i / M;
      const tp = topAt(s, t), bt = botAt(s, t);
      const h = (tp - bt) * 0.5, dy = (tp + bt) * 0.5;
      const w = s.wMax * profLerp(BODY_TPL.wid, t);
      const z = zN - t * L;
      for (let j = 0; j <= N; j++) {
        const a = (j / N) * Math.PI * 2;
        const ca = Math.cos(a), sa = Math.sin(a);
        const n = sa >= 0 ? nTop : nBot;
        /* 脊线收窄：越靠背/腹中线越薄，避免做成圆管 */
        const ridge = 1 - s.ridge * Math.pow(Math.abs(sa), 5);
        const px = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / n) * w * ridge;
        const py = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / n) * h + dy;
        pos.push(px, py, z);
        /* v：0 腹、0.5 两侧腰线、1 背脊 */
        uv.push(t, 0.5 + sa * 0.5);
      }
    }
    for (let i = 0; i < M; i++) {
      for (let j = 0; j < N; j++) {
        const a = i * (N + 1) + j, b = a + 1, c = a + (N + 1), d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    /* 鼻端封盖 */
    const nose = pos.length / 3;
    pos.push(0, (topAt(s, 0) + botAt(s, 0)) * 0.5, zN + L * 0.004);
    uv.push(0, 0.5);
    for (let j = 0; j < N; j++) idx.push(nose, j + 1, j);
    /* 尾端封盖 */
    const last = M * (N + 1);
    const tail = pos.length / 3;
    pos.push(0, (topAt(s, 1) + botAt(s, 1)) * 0.5, zT - L * 0.004);
    uv.push(1, 0.5);
    for (let j = 0; j < N; j++) idx.push(tail, last + j, last + j + 1);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  /* ---- 鳍累加器：把多片膜并进一个 geometry ---- */
  function FinAcc() { this.pos = []; this.uv = []; this.idx = []; }
  FinAcc.prototype.membrane = function (fn, S, T) {
    const base = this.pos.length / 3;
    for (let i = 0; i <= T; i++) {
      for (let j = 0; j <= S; j++) {
        const p = fn(i / T, j / S);
        this.pos.push(p[0], p[1], p[2]);
        this.uv.push(i / T, j / S);
      }
    }
    for (let i = 0; i < T; i++) {
      for (let j = 0; j < S; j++) {
        const a = base + i * (S + 1) + j, b = a + 1, c = a + (S + 1), d = c + 1;
        this.idx.push(a, c, b, b, c, d);
      }
    }
  };
  FinAcc.prototype.geo = function () {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    g.computeVertexNormals();
    return g;
  };

  /* 背鳍 / 臀鳍 / 腹鳍：根部在体中线上，外缘按高度曲线起伏 */
  function addSail(acc, s, cfg, side) {
    const hp = cfg.hp || [[0, 0.1], [0.2, 0.85], [0.5, 1], [0.8, 0.85], [1, 0.1]];
    acc.membrane(function (u, v) {
      const t = cfg.t0 + (cfg.t1 - cfg.t0) * u;
      const base = side > 0 ? topAt(s, t) : botAt(s, t);
      const hh = cfg.h * profLerp(hp, u);
      /* 鳍面沿 x 有极轻微的起伏，避免完全平面 */
      const x = 0.008 * Math.sin(v * Math.PI) * Math.sin(u * Math.PI * 4.2);
      return [x, base + side * hh * v, s.len * 0.5 - t * s.len];
    }, 5, 16);
  }

  /* 胸鳍：从体侧向后下方张开 */
  function addPec(acc, s, cfg, side) {
    acc.membrane(function (u, v) {
      const t = cfg.t;
      const w = s.wMax * profLerp(BODY_TPL.wid, t);
      const tp = topAt(s, t), bt = botAt(s, t);
      const y0 = (tp + bt) * 0.5;
      const z0 = s.len * 0.5 - t * s.len;
      const a = -0.55 + u * 0.90;
      const rr = v * cfg.span;
      return [
        side * (w * 0.86 + Math.cos(a) * rr * 0.62),
        y0 - 0.004 - rr * 0.46,
        z0 - Math.sin(a) * rr - cfg.back * v * v * 0.55
      ];
    }, 6, 9);
  }

  /* 雷达鱼的第一背鳍长鳍条 */
  function addSpike(acc, s, cfg, side) {
    acc.membrane(function (u, v) {
      const t = cfg.t;
      const base = topAt(s, t);
      const z0 = s.len * 0.5 - t * s.len;
      const w = Math.max(0.012, s.wMax * 0.24);
      const bend = Math.sin(u * Math.PI) * 0.06;
      return [
        (v - 0.5) * 2 * w * (1 - u * 0.7),
        base + cfg.h * s.hTop * u,
        z0 + cfg.len * u * 0.55 + bend
      ];
    }, 3, 10);
  }

  /* 尾鳍：极坐标扇形，外缘为圆弧 */
  function buildCaudalGeo(shape) {
    const s = shape, c = s.caudal;
    const acc = new FinAcc();
    acc.membrane(function (u, v) {
      const a = u * 2 - 1, na = Math.abs(a);
      let R = c.len, thMax = 1.10;
      if (c.kind === 'round') { R = c.len * (0.80 + 0.20 * Math.cos(a * Math.PI * 0.5)); thMax = 1.05; }
      else if (c.kind === 'fork') { R = c.len * (0.72 + 0.28 * na) - c.len * 0.26 * Math.exp(-a * a * 10); thMax = 1.18; }
      else if (c.kind === 'lunate') { R = c.len * (0.80 + 0.20 * na) - c.len * 0.40 * Math.exp(-(na - 0.70) * (na - 0.70) * 18); thMax = 1.26; }
      else { R = c.len * (0.92 + 0.08 * (1 - na)); thMax = 1.10; }
      const th = a * thMax, r = R * v;
      const z0 = -s.len * 0.5 + 0.004;
      const y0 = (topAt(s, 1) + botAt(s, 1)) * 0.5;
      return [0.012 * a * v, y0 + a * 0.030 + Math.sin(th) * r, z0 - Math.cos(th) * r];
    }, 22, 10);
    return acc.geo();
  }

  /* 背 / 臀 / 腹 / 胸 合并成一个 geometry */
  function buildFishFinGeo(shape) {
    const s = shape;
    const acc = new FinAcc();
    if (s.dorsals) for (let i = 0; i < s.dorsals.length; i++) addSail(acc, s, s.dorsals[i], 1);
    if (s.spike) addSpike(acc, s, s.spike, 1);
    if (s.anal) addSail(acc, s, s.anal, -1);
    if (s.pelvic) addSail(acc, s, s.pelvic, -1);
    if (s.pec) { addPec(acc, s, s.pec, 1); addPec(acc, s, s.pec, -1); }
    return acc.geo();
  }

  /* ---- 眼睛：深色眼球 + 高光点（顶点色） ---- */
  function buildEyeGeo(shape) {
    const s = shape, e = s.eye;
    const pos = [], col = [], idx = [];
    const w = s.wMax * profLerp(BODY_TPL.wid, e.t);
    const y = (topAt(s, e.t) + botAt(s, e.t)) * 0.5 + e.y;
    const z = s.len * 0.5 - e.t * s.len;
    const dark = new THREE.Color(0xf2efe6);
    const white = new THREE.Color(0xffffff);

    function sphere(cx, cy, cz, r, color, su, sv, dim) {
      const base = pos.length / 3;
      const c = new THREE.Color(color);
      for (let i = 0; i <= su; i++) {
        const phi = (i / su) * Math.PI;
        for (let j = 0; j <= sv; j++) {
          const th = (j / sv) * Math.PI * 2;
          const nx = Math.sin(phi) * Math.cos(th);
          const ny = Math.cos(phi);
          const nz = Math.sin(phi) * Math.sin(th);
          pos.push(cx + nx * r * dim[0], cy + ny * r * dim[1], cz + nz * r * dim[2]);
          col.push(c.r, c.g, c.b);
        }
      }
      for (let i = 0; i < su; i++) {
        for (let j = 0; j < sv; j++) {
          const a = base + i * (sv + 1) + j, b = a + 1, cc = a + (sv + 1), d = cc + 1;
          idx.push(a, cc, b, b, cc, d);
        }
      }
    }

    for (let side = -1; side <= 1; side += 2) {
      // 眼球：深色（贴图眼里用深色）
      sphere(side * (w * 0.84 + e.r * 0.44), y, z, e.r * 1.06, 0x0a0806, 14, 12, [1, 1, 1]);
      // 高光：球面外一点
      sphere(side * (w * 0.86 + e.r * 0.42 + e.r * 0.72),
             y + e.r * 0.36, z + e.r * 0.30, e.r * 0.17, 0xffffff, 7, 6, [1, 1, 1]);
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  /* ---- 皮肤贴图：1024×512，y=0 背脊 → y=H 腹底 ---- */
  function makeFishTexture(id) {
    const W = 1024, H = 512;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const s = FISH_SHAPE[id];
    const kind = (s.skin && s.skin.kind) || 'plain';

    function baseGrad(stops) {
      const gr = g.createLinearGradient(0, 0, 0, H);
      for (const st of stops) gr.addColorStop(st[0], st[1]);
      return gr;
    }
    function scales(x0, x1, y0, y1, step, alpha, tint) {
      g.save();
      g.globalAlpha = alpha;
      g.strokeStyle = tint || '#3a1a08';
      g.lineWidth = 0.9;
      let row = 0;
      for (let y = y0; y < y1; y += step * 0.60, row++) {
        const off = (row % 2) * step * 0.5;
        for (let x = x0 + off; x < x1; x += step) {
          g.beginPath(); g.arc(x, y, step * 0.60, 0.3, Math.PI - 0.3); g.stroke();
        }
      }
      g.restore();
    }
    function band(cx, hw, fill) {
      g.beginPath();
      const N = 48;
      for (let i = 0; i <= N; i++) {
        const y = (i / N) * H;
        const bend = 18 * Math.sin((i / N) * Math.PI * 0.9) - 10;
        g.lineTo(cx * W + bend - hw * W, y);
      }
      for (let i = N; i >= 0; i--) {
        const y = (i / N) * H;
        const bend = 18 * Math.sin((i / N) * Math.PI * 0.9) - 10;
        g.lineTo(cx * W + bend + hw * W, y);

  /* ---- 鳞片法线：高度图 → sobel → 法线 ---- */
  let scaleNormalShared = null;
  function makeScaleNormal() {
    if (scaleNormalShared) return scaleNormalShared;
    const W = 256, H = 256;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, W, H);
    const cols = 8, rows = 6;
    for (let r = -1; r <= rows; r++) {
      for (let q = -1; q <= cols; q++) {
        const cx = (q + (r % 2 ? 0.5 : 0)) * (W / cols);
        const cy = r * (H / rows);
        const rad = (W / cols) * 0.62;
        const rg = g.createRadialGradient(cx + rad * 0.25, cy + rad * 0.30, rad * 0.10, cx, cy, rad);
        rg.addColorStop(0, '#f2f2f2');
        rg.addColorStop(0.62, '#a8a8a8');
        rg.addColorStop(1, '#3c3c3c');
        g.fillStyle = rg;
        g.beginPath(); g.arc(cx, cy, rad, 0.06, Math.PI - 0.06); g.fill();
      }
    }
    const src = g.getImageData(0, 0, W, H);
    const out = g.createImageData(W, H);
    const hAt = function (x, y) {
      x = (x + W) % W; y = (y + H) % H;
      return src.data[(y * W + x) * 4] / 255;
    };
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (hAt(x + 1, y) - hAt(x - 1, y)) * 2.6;
        const dy = (hAt(x, y + 1) - hAt(x, y - 1)) * 2.6;
        let nx = -dx, ny = -dy, nz = 1;
        const l = Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx /= l; ny /= l; nz /= l;
        const i = (y * W + x) * 4;
        out.data[i] = (nx * 0.5 + 0.5) * 255;
        out.data[i + 1] = (ny * 0.5 + 0.5) * 255;
        out.data[i + 2] = (nz * 0.5 + 0.5) * 255;
        out.data[i + 3] = 255;
      }
    }
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    cv.getContext('2d').putImageData(out, 0, 0);
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(9, 4);
    scaleNormalShared = t;
    return t;
  }

  /* ---- 材质：身体带鳞片法线 + 游动波；鳍不受光，避免被压黑 ---- */

      'transformed.x += sin(transformed.z * ' + sw.freq.toFixed(2) + ' * swimRate + swimPh) * swimAmp * tailW;',

        shader.fragmentShader = 'uniform vec3 uWaterFog;\nvarying float vWorldY;\n' + shader.fragmentShader;
        shader.vertexShader = 'attribute vec3 aPhase;\nuniform float uTime;\n' + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <begin_vertex>',
          '#include <begin_vertex>\n' + waveGLSL + '\n' + FOG_ASSIGN + (extra ? '\n' + extra : '')
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <dithering_fragment>',
          '#include <dithering_fragment>\n' +
          'float wDep = clamp(-vWorldY / 0.92, 0.0, 1.0);\n' +
          'gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterFog, wDep * 0.30);'
        );
        if (needRim) {
          shader.uniforms.uRim = { value: new THREE.Vector3(0.42, 0.84, 1.0) };
          shader.fragmentShader = 'uniform vec3 uRim;\n' + shader.fragmentShader;
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            '#include <dithering_fragment>\n' +
            'float rimF = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 3.0);\n' +
            'gl_FragColor.rgb += uRim * rimF * 0.22;'
          );
        }
      };
      mat.customProgramCacheKey = function () { return key; };
    }

    const body = new THREE.MeshPhysicalMaterial({
      map: makeFishTexture(id),
      normalMap: makeScaleNormal(),
      normalScale: new THREE.Vector2(0.30, 0.30),
      roughness: 0.52,
      metalness: 0.0,
      clearcoat: 0.16,
      clearcoatRoughness: 0.62,
      side: THREE.FrontSide
    });
    injectWave(body, 'fishBodyM3-' + id, null, true);

    const fin = new THREE.MeshBasicMaterial({
      map: makeFinTexture(shape, 'fin'),
      transparent: true,
      opacity: 0.94,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    injectWave(fin, 'fishFinM3-' + id,
      'transformed.y += sin(uTime * 7.5 + aPhase.x + transformed.z * 9.0) * 0.005;', false);

    const caudal = new THREE.MeshBasicMaterial({
      map: makeFinTexture(shape, 'caudal'),
      transparent: true,
      opacity: 0.94,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    injectWave(caudal, 'fishCaudalM3-' + id, null, false);

    const eye = new THREE.MeshBasicMaterial({
      vertexColors: true,
      side: THREE.FrontSide
    });
    return { body: body, fin: fin, caudal: caudal, eye: eye };
  }


  function initFish() {
    surfaceFx = new THREE.Group();
    surfaceFx.layers.set(1);
    scene.add(surfaceFx);
    invertRoot = new THREE.Group();
    invertRoot.layers.set(0);
    scene.add(invertRoot);

    for (let k = 0; k < FISH_IDS.length; k++) {
      const id = FISH_IDS[k];
      const shape = FISH_SHAPE[id];
      const v = FISH_VISUAL[id];
      const bodyGeo = buildFishBodyGeo(shape);
      bodyGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(FISH_MAX * 3), 3));
      const finGeo = buildFishFinGeo(shape);
      finGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(FISH_MAX * 3), 3));
      const caudalGeo = buildCaudalGeo(shape);
      caudalGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(FISH_MAX * 3), 3));
      const mats = makeFishMaterials(shape, id);
      const eyeGeo = buildEyeGeo(shape);
      const bodyMesh = new THREE.InstancedMesh(bodyGeo, mats.body, FISH_MAX);
      const eyeMesh = new THREE.InstancedMesh(eyeGeo, mats.eye, FISH_MAX);
      eyeMesh.count = 0;
      eyeMesh.frustumCulled = false;
      eyeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      eyeMesh.layers.set(0);
      scene.add(eyeMesh);
      const finMesh = new THREE.InstancedMesh(finGeo, mats.fin, FISH_MAX);
      const caudalMesh = new THREE.InstancedMesh(caudalGeo, mats.caudal, FISH_MAX);
      bodyMesh.count = 0; finMesh.count = 0; caudalMesh.count = 0;
      bodyMesh.frustumCulled = false; finMesh.frustumCulled = false; caudalMesh.frustumCulled = false;
      bodyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      finMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      caudalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      bodyMesh.layers.set(0); finMesh.layers.set(0); caudalMesh.layers.set(0);
      finMesh.renderOrder = 1; caudalMesh.renderOrder = 1;
      scene.add(bodyMesh); scene.add(finMesh); scene.add(caudalMesh);
      fishState[id] = {
        v: v, shape: shape, eyeMesh: eyeMesh, eyeMat: mats.eye,
        bodyGeo: bodyGeo, finGeo: finGeo, caudalGeo: caudalGeo,
        bodyMat: mats.body, finMat: mats.fin, caudalMat: mats.caudal,
        bodyMesh: bodyMesh, finMesh: finMesh, caudalMesh: caudalMesh,
        bodyPhase: bodyGeo.attributes.aPhase,
        finPhase: finGeo.attributes.aPhase,
        caudalPhase: caudalGeo.attributes.aPhase
      };
    }

    const shGeo = new THREE.PlaneGeometry(1, 1);
    shGeo.rotateX(-Math.PI / 2);
    const shMat = new THREE.MeshBasicMaterial({
      map: shadowTex, color: 0x021017, transparent: true, opacity: 0.55, depthWrite: false
    });
    fishShadowMesh = new THREE.InstancedMesh(shGeo, shMat, FISH_MAX + INVERT_MAX * 2);
    fishShadowMesh.count = 0;
    fishShadowMesh.frustumCulled = false;
    fishShadowMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    fishShadowMesh.layers.set(0);
    fishShadowMesh.renderOrder = 2;
    scene.add(fishShadowMesh);

    initFoodMesh();
    renderThumbnails(DRAWER_IDS);
  }

  /* ---- 鱼食：alpha 薄片 ---- */
  function makeFlakeTexture() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 64, 64);
    /* 不规则薄片轮廓 */
    g.beginPath();
    const pts = [];
    const n = 11;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = 22 + (i % 3) * 5 + (i % 2) * 3;
      pts.push([32 + Math.cos(a) * r, 32 + Math.sin(a) * r * 0.82]);
    }
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    const gr = g.createRadialGradient(26, 24, 2, 32, 32, 30);
    gr.addColorStop(0, '#e0a854');
    gr.addColorStop(0.55, '#b87a30');
    gr.addColorStop(1, '#7d4f1e');
    g.fillStyle = gr;
    g.fill();
    /* 碎片感 */
    g.fillStyle = 'rgba(60,36,14,.35)';
    for (let i = 0; i < 22; i++) g.fillRect(10 + Math.random() * 44, 10 + Math.random() * 44, 2.4, 2.4);
    g.fillStyle = 'rgba(255,230,180,.30)';
    for (let i = 0; i < 8; i++) g.fillRect(14 + Math.random() * 36, 14 + Math.random() * 36, 3, 1.6);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  function initFoodMesh() {
    const fgeo = new THREE.PlaneGeometry(0.085, 0.085);
    fgeo.rotateX(-Math.PI / 2);
    const fmat = new THREE.MeshStandardMaterial({
      map: makeFlakeTexture(),
      transparent: true,
      alphaTest: 0.4,
      roughness: 0.65,
      metalness: 0.0,
      side: THREE.DoubleSide
    });
    foodMesh = new THREE.InstancedMesh(fgeo, fmat, 32);
    foodMesh.count = 0;
    foodMesh.frustumCulled = false;
    foodMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    foodMesh.layers.set(0);
    surfaceFx.add(foodMesh);
  }

  /* ---- 任意物种的独立模型（缩略图 / 拖拽预览） ---- */
  function buildModelGroup(id, phase) {
    const sp = SPECIES[id];
    if (!sp) return new THREE.Group();
    if (sp.kind === 'fish') {
      const shape = FISH_SHAPE[id];
      const st = fishState[id];
      const ph = (typeof phase === 'number') ? phase : 0;
      const fillPh = function (g, spd) {
        const c = g.attributes.position.count;
        const arr = new Float32Array(c * 3);
        for (let i = 0; i < c; i++) { arr[i * 3] = ph; arr[i * 3 + 1] = spd; arr[i * 3 + 2] = 0; }
        g.setAttribute('aPhase', new THREE.BufferAttribute(arr, 3));
      };
      const bodyGeo = buildFishBodyGeo(shape);
      fillPh(bodyGeo, 0.9);
      const finGeo = buildFishFinGeo(shape);
      fillPh(finGeo, 0.9);
      const caudalGeo = buildCaudalGeo(shape);
      fillPh(caudalGeo, 0.9);
      const g = new THREE.Group();
      g.add(new THREE.Mesh(bodyGeo, st.bodyMat));
      g.add(new THREE.Mesh(finGeo, st.finMat));
      g.add(new THREE.Mesh(caudalGeo, st.caudalMat));
      g.add(new THREE.Mesh(buildEyeGeo(shape), st.eyeMat));
      return g;
    }
    if (id === 'cleaner') return buildShrimpModel();
    if (id === 'hermit') return buildHermitModel();
    return new THREE.Group();
  }

  function disposeGroup(g) {
    g.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
  }

  function renderThumbnails(ids) {
    const w = 384, h = 224;
    const rt = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: true
    });
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(30, w / h, 0.05, 20);
    cam.position.set(0, 2.0, 0.55);
    cam.lookAt(0, 0, 0);
    sc.add(new THREE.HemisphereLight(0xffffff, 0x335566, 1.3));
    const dl = new THREE.DirectionalLight(0xffffff, 1.8);
    dl.position.set(1.2, 2.4, 1.0);
    sc.add(dl);

    const buf = new Uint8Array(w * h * 4);
    const cv = document.createElement('canvas');
