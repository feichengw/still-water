    const btn = document.querySelector('[data-action="calm"]');
    if (btn) btn.classList.toggle('on', v);
    toast(v ? '水面静了' : '涟漪回来了');
    Bus.emit('water:calm', v);
  }

  function cycleLight() {
    const order = ['day', 'night', 'auto'];
    const i = order.indexOf(state.lightMode);
    state.lightMode = order[(i + 1) % order.length];
    const labels = { day: '灯光 · 日间', night: '灯光 · 夜间', auto: '灯光 · 自动循环（2 分钟）' };
    toast(labels[state.lightMode]);
    Bus.emit('light:mode', state.lightMode);
  }

  function toggleBare() {
    document.body.classList.toggle('bare');
  }

  let toastTimer = 0;

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function initUI() {
    const dock = $('dock');
    for (let i = 0; i < ACTIONS.length; i++) {
      const a = ACTIONS[i];
      const b = document.createElement('button');
      b.className = 'btn';
      b.dataset.action = a.id;
      b.title = a.label + '（' + a.key + '）';
      b.innerHTML = ICONS[a.id] + '<span class="key">' + a.key + '</span>';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        runAction(a.id);
      });
      dock.appendChild(b);
    }
    $('toast').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  }

  function runAction(id) {
    switch (id) {
      case 'calm': Bus.emit('user:calm', !state.calm); break;
      case 'feed': feed(); break;
      case 'bubble': toggleBubbles(); break;
      case 'flow': toggleFlow(); break;
      case 'water': pourWater(); break;
      case 'sound': toggleSound(); break;
      case 'light': Bus.emit('user:light'); break;
      case 'hide': Bus.emit('user:bare'); break;
      case 'shot': takeShot(); break;
      default: toast(PLANNED[id] || '该功能尚未接入');
    }
  }

  function takeShot() {
    try {
      renderFrame();
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = '静水-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('画面已保存');
    } catch (e) {
      toast('截图失败：' + ((e && e.message) || e));
    }
  }

  function initEvents() {
    const dock = document.getElementById('camDock');
    if (dock) {
      dock.addEventListener('click', function (e) {
        const pill = e.target.closest('.cam-pill');
        if (!pill) return;
        setCam(parseInt(pill.getAttribute('data-cam'), 10));
      });
    }

    window.addEventListener('resize', onResize, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) lastFrame = performance.now() * 0.001;
    });

    window.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      const map = {
        f: 'feed', b: 'bubble', w: 'flow', c: 'calm', t: 'water',
        l: 'light', m: 'sound', p: 'shot', h: 'hide', r: 'reshuffle'
      };
      if (k >= '1' && k <= '5') {
        e.preventDefault();
        setCam(parseInt(k, 10) - 1);
        return;
      }
      if (!map[k]) return;
      e.preventDefault();
      if (map[k] === 'reshuffle') { reshuffleScenery(); return; }
      runAction(map[k]);
    });
  }

  function reshuffleScenery() {
    buildScenery((Math.random() * 1e9) | 0);
    toast('造景已重排');
    Bus.emit('scenery:shuffle', {});
  }

  let resizePending = false;
  function onResize() {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(function () {
      resizePending = false;
      resize();
    });
  }

  /* 复用临时对象：three 是异步加载的，不能在顶层直接 new，首次用到时再建 */
  let _ray = null, _plane = null, _ndc = null, _p00 = null, _p10 = null, _p01 = null;

  function updateCamera() {
    if (!_ray) {
      _ray = new THREE.Raycaster();
      _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      _ndc = new THREE.Vector2();
      _p00 = new THREE.Vector3();
      _p10 = new THREE.Vector3();
      _p01 = new THREE.Vector3();
    }
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    const aspect = w / h;

    const tiltDeg = camPose.tilt;
    tilt = THREE.MathUtils.degToRad(tiltDeg);
    const c = Math.cos(tilt);
    const s = Math.sin(tilt);
    const tw = CONFIG.tank.w, td = CONFIG.tank.d;
    const D = CONFIG.camera.distance;
    const z = Math.max(1, camPose.zoom);
    const ox = camPose.tx, oz = camPose.tz;

    let halfW, halfH;

    if (aspect < 1.0) {
      /* 竖屏：镜头绕竖轴转 90°，让缸的长边铺满屏幕竖向 */
      camera.position.set(s * D + ox, c * D, oz);
      camera.up.set(0, 1, 0);
      camera.lookAt(ox, 0, oz);
      camera.updateMatrixWorld(true);
      halfH = Math.min((tw / 2) * c, (td / 2) / aspect) / z;
      halfW = halfH * aspect;
    } else {
      camera.position.set(ox, c * D, s * D + oz);
      camera.up.set(0, 1, 0);
      camera.lookAt(ox, 0, oz);
      camera.updateMatrixWorld(true);

      if (aspect >= 1.55) {
        /* 宽屏：缸水铺满屏幕，四壁贴边（16:9 时几乎不裁切） */
        halfH = Math.min((td * c) / 2, (tw / 2) / aspect) / z;
        halfW = halfH * aspect;
      } else {
        /* 近方形：先保证整缸可见，避免裁掉晒台 */
        halfW = (tw / 2) / z;
        halfH = halfW / aspect;
      }
    }

    camera.left = -halfW;
    camera.right = halfW;
    camera.top = halfH;
    camera.bottom = -halfH;
    camera.updateProjectionMatrix();

    /* 屏幕 uv → 水面 y=0 的仿射映射（正交相机下严格成立，与机位无关） */
    _ray.setFromCamera(_ndc.set(-1, -1), camera);
    _ray.ray.intersectPlane(_plane, _p00);
    _ray.setFromCamera(_ndc.set(1, -1), camera);
    _ray.ray.intersectPlane(_plane, _p10);
    _ray.setFromCamera(_ndc.set(-1, 1), camera);
    _ray.ray.intersectPlane(_plane, _p01);

    waterUniforms.uOrigin.value.set(_p00.x, _p00.z);
    waterUniforms.uViewX.value.set(_p10.x - _p00.x, _p10.z - _p00.z);
    waterUniforms.uViewY.value.set(_p01.x - _p00.x, _p01.z - _p00.z);
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(state.dpr);
    renderer.setSize(w, h, false);

    updateCamera();
    camera.layers.set(0);

    const size = new THREE.Vector2();
    renderer.getDrawingBufferSize(size);
    const bw = Math.max(2, Math.floor(size.x));
    const bh = Math.max(2, Math.floor(size.y));

    if (sceneRT) sceneRT.dispose();
    sceneRT = new THREE.WebGLRenderTarget(bw, bh, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });
    waterUniforms.uScene.value = sceneRT.texture;
  }

  /* =========================================================================
     渲染主循环
     ========================================================================= */

  function applyPalette(t) {
    for (let i = 0; i < COLORS.length; i++) {
      const k = COLORS[i];
      CUR[k].copy(DAY[k]).lerp(NIGHT[k], t);
    }

    waterUniforms.uShallow.value.copy(CUR.shallow);
    waterUniforms.uDeep.value.copy(CUR.deep);
    waterUniforms.uSkyA.value.copy(CUR.skyA);
    waterUniforms.uSkyB.value.copy(CUR.skyB);
    waterUniforms.uGlass.value.copy(CUR.glass);
    waterUniforms.uCausticCol.value.copy(CUR.caustic);
    waterUniforms.uNight.value = t;
    waterUniforms.uCalm.value = state.calmMix;
    waterUniforms.uCaustic.value = 0.12 * (1 - 0.72 * t) * (1 - 0.7 * state.murk);
    waterUniforms.uGlint.value = 0.05 * (1 - 0.75 * t) * (1 - 0.8 * state.murk);
    if (Math.abs(t - sfx._lastNight) > 0.02) sfx.setNight();

    dirMain.color.copy(CUR.dir);
    dirMain.intensity = lerp(0.58, 0.16, t);
    dirFill.color.copy(CUR.hemiSky);
    dirFill.intensity = lerp(0.08, 0.03, t);
    hemi.color.copy(CUR.hemiSky);
    hemi.groundColor.copy(CUR.hemiGround);
    hemi.intensity = lerp(0.22, 0.09, t);

    renderer.setClearColor(CUR.deep, 1);
  }

  function updateAnemones(t) {
    if (!anemones.length) return;
    const dummy = new THREE.Object3D();
    for (let a = 0; a < anemones.length; a++) {
      const an = anemones[a];
      const inst = an.inst;
      for (let i = 0; i < an.items.length; i++) {
        const it = an.items[i];
        const sw = Math.sin(t * it.sp * 1.35 + it.ph);
        const sw2 = Math.cos(t * it.sp * 1.05 + it.ph * 1.3);
        dummy.position.set(it.x, 0.075, it.z);
        dummy.rotation.set(it.ax + sw * 0.22, 0, it.az + sw2 * 0.22);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
    }
  }

  function sampleSurface(x, z, t, out) {
    out.h = 0.012 * Math.sin(x * 1.35 + t * 1.25)
      + 0.008 * Math.sin(z * 1.75 - t * 0.95)
      + 0.005 * Math.sin((x + z) * 1.05 + t * 0.70);
    out.gx = 0.0162 * Math.cos(x * 1.35 + t * 1.25)
      + 0.0053 * Math.cos((x + z) * 1.05 + t * 0.70);
    out.gz = 0.0140 * Math.cos(z * 1.75 - t * 0.95)
      + 0.0053 * Math.cos((x + z) * 1.05 + t * 0.70);

    for (let i = 0; i < recentRipples.length; i++) {
      const r = recentRipples[i];
      const age = t - r.t0;
      if (age < 0 || age > 6) continue;
      const dx = x - r.x;
      const dz = z - r.z;
      const dist = Math.sqrt(dx * dx + dz * dz) + 0.001;
      const decay = Math.exp(-age * 1.6) * Math.exp(-dist * 0.38);
      const amp = r.s * 0.05 * decay;
      const ph = dist * 5.0 - age * 8.0;
      out.h += Math.sin(ph) * amp;
      const dh = Math.cos(ph) * amp * 5.0;
      out.gx += dh * dx / dist;
      out.gz += dh * dz / dist;
    }
  }

  function updateDuckweed(t, dt) {
    if (!duckWeeds) return;
    const dummy = new THREE.Object3D();
    const darkDummy = new THREE.Object3D();
    const sw = { h: 0, gx: 0, gz: 0 };
    const hw = CONFIG.tank.w / 2 - 0.2;
    const hd = CONFIG.tank.d / 2 - 0.2;
    const fl = flowVec();

    while (recentRipples.length && t - recentRipples[0].t0 > 6) recentRipples.shift();

    for (let i = 0; i < duckWeedData.length; i++) {
      const d = duckWeedData[i];
      d.x += (d.vx + fl.x * 0.05) * dt;
      d.z += (d.vz + fl.y * 0.05) * dt;
      if (d.x < -hw) d.x = hw; else if (d.x > hw) d.x = -hw;
      if (d.z < -hd) d.z = hd; else if (d.z > hd) d.z = -hd;

      const px = d.x - SCENERY_LAYOUT.platform.x;
      const pz = d.z - SCENERY_LAYOUT.platform.z;
      const pd = Math.sqrt(px * px + pz * pz);
      if (pd < 2.2) {
        const k = 2.2 / Math.max(pd, 0.001);
        d.x = SCENERY_LAYOUT.platform.x + px * k;
        d.z = SCENERY_LAYOUT.platform.z + pz * k;
      }

      sampleSurface(d.x, d.z, t, sw);
      const y = 0.010 + sw.h;
      const rx = clamp(sw.gz * 2.2, -0.5, 0.5);
      const rz = clamp(-sw.gx * 2.2, -0.5, 0.5);
      const spin = d.rot + t * 0.04 + Math.sin(t * 0.31 + d.ph) * 0.12;

      darkDummy.position.set(d.x, y - 0.0016, d.z);
      darkDummy.rotation.set(rx, spin, rz);
      darkDummy.scale.setScalar(d.s);
      darkDummy.updateMatrix();
      duckWeedDark.setMatrixAt(i, darkDummy.matrix);

      dummy.position.set(d.x + 0.0018, y + 0.0014, d.z + 0.0012);
      dummy.rotation.set(rx, spin, rz);
      dummy.scale.setScalar(d.s * 0.78);
      dummy.updateMatrix();
      duckWeeds.setMatrixAt(i, dummy.matrix);
    }
    duckWeedDark.instanceMatrix.needsUpdate = true;
    duckWeeds.instanceMatrix.needsUpdate = true;
  }

  function renderFrame() {
    if (!renderer || !sceneRT) return;

    renderer.setClearColor(CUR.deep, 1);
    renderer.setRenderTarget(sceneRT);
    renderer.clear(true, true, false);
    camera.layers.set(0);
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000, 1);
    renderer.clear(true, true, false);
    renderer.render(waterScene, waterCamera);

    renderer.autoClear = false;
    renderer.clearDepth();
    camera.layers.set(1);
    renderer.render(scene, camera);
    renderer.autoClear = true;
    camera.layers.set(0);
  }

  function animate(nowMs) {
    requestAnimationFrame(animate);
    const now = nowMs * 0.001;
    let dt = now - lastFrame;
    lastFrame = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;

    state.time += dt;

    /* 静水过渡 */
    const calmTarget = state.calm ? 1 : 0;
    state.calmMix += (calmTarget - state.calmMix) * Math.min(1, dt * 4.0);

    /* 水面模拟：固定步长 */
    simAcc += dt;
    let steps = 0;
    while (simAcc >= 1 / 60 && steps < 2) {
      simStep();
      simAcc -= 1 / 60;
      steps++;
    }
    if (steps === 2) simAcc = 0;

    /* 环境微涟漪 */
    if (!state.calm && state.time > nextAmbient) {
      const rx = (Math.random() - 0.5) * CONFIG.tank.w * 0.8;
      const rz = (Math.random() - 0.5) * CONFIG.tank.d * 0.8;
      addRipple(rx, rz, 0.16, 0.85);
      nextAmbient = state.time + CONFIG.water.ambientEvery + Math.random() * 6;
    }

    for (let i = 0; i < plugins.length; i++) {
      if (plugins[i].update) plugins[i].update(dt, state.time);
    }

    if (!state.frozen) updateCamAnim(dt);
    updateAnemones(state.time);
    updateDuckweed(state.time, dt);
    const cdt = state.frozen ? 0 : dt;
    updateFish(cdt, state.time);
    updateInverts(cdt, state.time);
    if (!state.frozen) separateAll();
    updateFood(cdt, state.time);
    updateBubbles(cdt, state.time);
    updateMotes(cdt, state.time);
    updateSparks(cdt, state.time);
    updatePour(cdt, state.time);
    updateAlgae(dt);
    updateQuality(dt);
    updateQualityUI(dt);

    if (ghostMesh) {
      ghostMesh.rotation.y += dt * 0.9;
      ghostMesh.position.y = 0.30 + Math.sin(state.time * 2.1) * 0.02;
    }

    waterUniforms.uTime.value = state.time;
    waterUniforms.uCalm.value = state.calmMix;

    renderFrame();
    adaptQuality(dt);

    if (!state.ready) {
      state.ready = true;
      setTimeout(function () { document.body.classList.add('ready'); }, 220);
      setTimeout(function () { $('hint').classList.add('hide'); }, 11000);
      Bus.emit('app:ready', {});
    }
  }

  function adaptQuality(dt) {
    fpsFrames++;
    fpsTime += dt;
    if (fpsTime < 1) return;

    const fps = fpsFrames / fpsTime;
    state.fps = fps;
    fpsFrames = 0;
    fpsTime = 0;
    adaptCooldown--;
    if (adaptCooldown > 0) return;

    if (fps < CONFIG.quality.lowFps && state.dpr > CONFIG.quality.dprMin) {
      state.dpr = Math.max(CONFIG.quality.dprMin, state.dpr - 0.25);
      adaptCooldown = CONFIG.quality.adaptCooldown;
      goodFpsTime = 0;
      resize();
    } else if (fps > CONFIG.quality.highFps && state.dpr < CONFIG.quality.dprMax) {
      goodFpsTime++;
      if (goodFpsTime >= 6) {
        state.dpr = Math.min(CONFIG.quality.dprMax, state.dpr + 0.25);
        adaptCooldown = CONFIG.quality.adaptCooldown;
        goodFpsTime = 0;
        resize();
      }
    } else {
      goodFpsTime = 0;
    }
  }

  /* =========================================================================
     启动
     ========================================================================= */

  window.__loadThree(function (err) {
    if (err) {
      showFatal(
        'three.js 没能加载',
        '页面需要 three.js r128。请确认浏览器能访问 cdnjs.cloudflare.com，或把 three.min.js 放在与本文件相同的目录后刷新。',
        '下载地址：https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
      );
      return;
    }
    start();
  });

  /* 调试出口：控制台可直接改参数 / 触发互动（截图探针也用） */
  window.__STILL_WATER__ = {
    CONFIG: CONFIG, state: state, Bus: Bus,
    debug: {
      spawn: spawnCreature,
      feed: feed,
      knock: doKnock,
      pour: pourWater,
      bubbles: toggleBubbles,
      flow: toggleFlow,
      sound: toggleSound,
      quality: function () { return state.quality; },
      counts: function () { return { fish: fishList.length, invert: invertList.length, algae: algaeList.length, shells: spareShells.length }; }
    }
  };

})();
</script>
<div id="camDock">
  <div class="cam-title">机位</div>
  <div class="cam-pill on" data-cam="0"><b>1</b><span>全景</span></div>
  <div class="cam-pill" data-cam="1"><b>2</b><span>特写</span></div>
  <div class="cam-pill" data-cam="2"><b>3</b><span>水面</span></div>
  <div class="cam-pill" data-cam="3"><b>4</b><span>贴水</span></div>
  <div class="cam-pill" data-cam="4"><b>5</b><span>俯瞰</span></div>
</div>
