    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');

    const prevTarget = renderer.getRenderTarget();
    const prevColor = new THREE.Color();
    renderer.getClearColor(prevColor);
    const prevAlpha = renderer.getClearAlpha();
    renderer.setClearColor(0x000000, 0);

    for (let k = 0; k < ids.length; k++) {
      const id = ids[k];
      const group = buildModelGroup(id);
      const isInvert = SPECIES[id].kind !== 'fish';
      /* 自动取景：包围盒居中 + 按最大边长自适应缩放 */
      group.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(group);
      const ctr = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      group.position.x -= ctr.x;
      group.position.y -= ctr.y;
      group.position.z -= ctr.z;
      const maxDim = Math.max(size.x, size.y, size.z) || 0.3;
      group.scale.setScalar((isInvert ? 0.46 : 0.88) / maxDim);
      group.rotation.y = isInvert ? 0.7 : 0.22;
      /* 无脊椎更靠近相机 */
      cam.position.set(0, isInvert ? 1.05 : 2.0, isInvert ? 0.32 : 0.55);
      cam.lookAt(0, 0, 0);
      sc.add(group);

      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(sc, cam);
      renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);

      const img = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        const sy = h - 1 - y;
        for (let x = 0; x < w; x++) {
          const si = (sy * w + x) * 4;
          const di = (y * w + x) * 4;
          img.data[di] = buf[si];
          img.data[di + 1] = buf[si + 1];
          img.data[di + 2] = buf[si + 2];
          img.data[di + 3] = buf[si + 3];
        }
      }
      ctx.putImageData(img, 0, 0);
      thumbUrls[id] = cv.toDataURL('image/png');

      sc.remove(group);
      disposeGroup(group);
    }

    renderer.setRenderTarget(prevTarget);
    renderer.setClearColor(prevColor, prevAlpha);
    rt.dispose();
  }

  function nearestAnemone(x, z) {
    let best = SCENERY_LAYOUT.anemones[0], bd = 1e9;
    for (let i = 0; i < SCENERY_LAYOUT.anemones.length; i++) {
      const a = SCENERY_LAYOUT.anemones[i];
      const d = (a.x - x) * (a.x - x) + (a.z - z) * (a.z - z);
      if (d < bd) { bd = d; best = a; }
    }
    return best;
  }

  function nearestRock(x, z) {
    let best = SCENERY_LAYOUT.rocks[0], bd = 1e9;
    for (let i = 0; i < SCENERY_LAYOUT.rocks.length; i++) {
      const r = SCENERY_LAYOUT.rocks[i];
      const d = (r.x - x) * (r.x - x) + (r.z - z) * (r.z - z);
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  }

  /* =========================================================================
     ④c 无脊椎动物（M3）：Soup 合并几何 + 顶点色
     ========================================================================= */

  /* 几何汤：把多个图元合并进单个 BufferGeometry（顶点色） */
  function Soup() { this.pos = []; this.nor = []; this.col = []; this.idx = []; this.seg = []; this.ph = []; }
  Soup.prototype.ellipsoid = function (o) {
    const su = o.su || 10, sv = o.sv || 8;
    const base = this.pos.length / 3;
    const col = o.c instanceof THREE.Color ? o.c : new THREE.Color(o.c);
    for (let i = 0; i <= su; i++) {
      const phi = (i / su) * Math.PI;
      for (let j = 0; j <= sv; j++) {
        const theta = (j / sv) * Math.PI * 2;
        const nx = Math.sin(phi) * Math.cos(theta);
        const ny = Math.cos(phi);
        const nz = Math.sin(phi) * Math.sin(theta);
        this.pos.push(o.p[0] + nx * o.r[0], o.p[1] + ny * o.r[1], o.p[2] + nz * o.r[2]);
        this.nor.push(nx, ny, nz);
        this.col.push(col.r, col.g, col.b);
        this.seg.push(0);
        this.ph.push(0);
      }
    }
    for (let i = 0; i < su; i++) {
      for (let j = 0; j < sv; j++) {
        const a = base + i * (sv + 1) + j, b = a + 1, c = a + (sv + 1), d = c + 1;
        this.idx.push(a, c, b, b, c, d);
      }
    }
  };
  Soup.prototype.tube = function (pts, radii, c0, c1, radial, colFn, ph) {
    if (typeof colFn === 'number') { ph = colFn; colFn = null; }
    radial = radial || 6;
    const col0 = c0 instanceof THREE.Color ? c0 : (c0 !== null && c0 !== undefined ? new THREE.Color(c0) : null);
    const col1 = c1 instanceof THREE.Color ? c1 : (c1 !== null && c1 !== undefined ? new THREE.Color(c1) : null);
    const rs = typeof radii === 'number' ? pts.map(function () { return radii; }) : radii;
    const base = this.pos.length / 3;
    const P = pts.length;
    const up = [0, 1, 0];
    for (let i = 0; i < P; i++) {
      const p = pts[i];
      const pn = pts[Math.min(P - 1, i + 1)];
      const pp = pts[Math.max(0, i - 1)];
      const t = [pn[0] - pp[0], pn[1] - pp[1], pn[2] - pp[2]];
      const tl = Math.hypot(t[0], t[1], t[2]) || 1;
      t[0] /= tl; t[1] /= tl; t[2] /= tl;
      let n = [up[1] * t[2] - up[2] * t[1], up[2] * t[0] - up[0] * t[2], up[0] * t[1] - up[1] * t[0]];
      const nl = Math.hypot(n[0], n[1], n[2]) || 1;
      n[0] /= nl; n[1] /= nl; n[2] /= nl;
      const b = [t[1] * n[2] - t[2] * n[1], t[2] * n[0] - t[0] * n[2], t[0] * n[1] - t[1] * n[0]];
      let col;
      if (colFn) col = colFn(i, P);
      else col = col0.clone().lerp(col1, P > 1 ? i / (P - 1) : 0);
      for (let j = 0; j <= radial; j++) {
        const a = (j / radial) * Math.PI * 2;
        const ca = Math.cos(a), sa = Math.sin(a);
        this.pos.push(
          p[0] + (n[0] * ca + b[0] * sa) * rs[i],
          p[1] + (n[1] * ca + b[1] * sa) * rs[i],
          p[2] + (n[2] * ca + b[2] * sa) * rs[i]
        );
        this.nor.push(n[0] * ca + b[0] * sa, n[1] * ca + b[1] * sa, n[2] * ca + b[2] * sa);
        this.col.push(col.r, col.g, col.b);
        this.seg.push(P > 1 ? i / (P - 1) : 0);
        this.ph.push(ph || 0);
      }
    }
    for (let i = 0; i < P - 1; i++) {
      for (let j = 0; j < radial; j++) {
        const a = base + i * (radial + 1) + j, b2 = a + 1, c = a + (radial + 1), d = c + 1;
        this.idx.push(a, c, b2, b2, c, d);
      }
    }
  };
  Soup.prototype.membrane = function (pts, color, ph) {
    if (typeof color === 'number') { color = 0xffffff; }
    /* 三角形扇：pts[0] 为扇心 */
    const base = this.pos.length / 3;
    const col = color instanceof THREE.Color ? color : new THREE.Color(color);
    for (let i = 0; i < pts.length; i++) {
      this.pos.push(pts[i][0], pts[i][1], pts[i][2]);
      this.nor.push(0, 1, 0);
      this.col.push(col.r, col.g, col.b);
      this.seg.push(0);
      this.ph.push(ph || 0);
    }
    for (let i = 1; i < pts.length - 1; i++) this.idx.push(base, base + i, base + i + 1);
  };
  Soup.prototype.geo = function () {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('aSeg', new THREE.Float32BufferAttribute(this.seg, 1));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(this.ph, 1));
    g.setIndex(this.idx);
    return g;
  };

  /* ---- 逐条肢体摆动：按 aSeg（沿条带 0→1）+ 个体世界位置做相位 ---- */
  function swayMat(mat, freq, amp, vertical) {
    /* 必须定点化：3.0 直接拼进 GLSL 会变成整数字面量 3，float*int 会编译失败 */
    const F = Number(freq).toFixed(3);
    const A = Number(amp).toFixed(4);
    const F2 = (Number(freq) * 0.83).toFixed(3);
    const F3 = (Number(freq) * 1.13).toFixed(3);
    const A2 = (Number(amp) * 0.55).toFixed(4);
    const A3 = (Number(amp) * 0.45).toFixed(4);
    mat.onBeforeCompile = function (sh) {
      sh.uniforms.uTime = fishTime;
      sh.vertexShader = 'attribute float aSeg;\nattribute float aPhase;\nuniform float uTime;\n' + sh.vertexShader;
      var extra =
        'float phb = modelMatrix[3].x * 1.7 + modelMatrix[3].z * 2.3;\n' +
        'float sgn = sign(transformed.x) + 0.001;\n' +
        'float wv = sin(uTime * ' + F + ' + phb + aPhase + sgn * 1.57 + aSeg * 2.7);\n' +
        'transformed.y += wv * ' + A + ' * aSeg;\n' +
        'transformed.z += cos(uTime * ' + F2 + ' + phb + aPhase + sgn * 1.57 + aSeg * 2.2) * ' + A2 + ' * aSeg;\n';
      if (vertical) {
        extra += 'transformed.x += sin(uTime * ' + F3 + ' + phb + aPhase + aSeg * 3.1) * ' + A3 + ' * aSeg;\n';
      }
      sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n' + extra);
    };
    mat.customProgramCacheKey = function () { return 'sway' + F + '_' + A; };
    return mat;
  }

  /* ---- 清洁虾：分节身体、弯曲腹部、展开尾扇、长触须 ----
     尺度对齐真实比例：小丑鱼体长 1.0，清洁虾约 0.5（不再是 0.2） */
  function buildShrimpModel() {
    const body = new Soup(), legs = new Soup(), ant = new Soup(), tail = new Soup();
    const cream = 0xfbf6ec, red = 0xe03422, white = 0xffffff, dark = 0x8f2018;

    /* 头胸甲：前粗后细，背部略隆 */
    body.ellipsoid({ p: [0, 0.030, 0.150], r: [0.052, 0.040, 0.088], c: cream, su: 14, sv: 12 });
    /* 背部红色纵带 */
    body.ellipsoid({ p: [0, 0.062, 0.140], r: [0.020, 0.012, 0.080], c: red, su: 10, sv: 8 });
    /* 额剑（吻刺） */
    body.tube([[0, 0.036, 0.232], [0, 0.044, 0.272], [0, 0.048, 0.302]], [0.006, 0.004, 0.0015], cream, cream, 6);
    /* 眼柄 + 复眼 */
    for (let s = -1; s <= 1; s += 2) {
      body.tube([[s * 0.030, 0.042, 0.222], [s * 0.036, 0.054, 0.240]], 0.006, cream, cream, 6);
      body.ellipsoid({ p: [s * 0.038, 0.058, 0.248], r: [0.012, 0.012, 0.012], c: 0x141018, su: 8, sv: 7 });
    }
    /* 腹节：6 节，向后收窄并轻微下弯 */
    for (let i = 0; i < 6; i++) {
      const z = 0.068 - i * 0.038;
      const k = 1 - i * 0.11;
      const y = 0.028 - i * 0.005;
      body.ellipsoid({ p: [0, y, z], r: [0.046 * k, 0.040 * k, 0.024], c: i % 2 ? cream : white, su: 12, sv: 10 });
      /* 每节后缘的红色环带 */
      body.tube([[0, y, z - 0.020], [0, y, z - 0.026]], [0.030 * k, 0.028 * k], red, red, 10);
    }
    /* 尾扇：5 片，向后展开 */
    for (let i = -2; i <= 2; i++) {
      const a = i * 0.30;
      const base = [Math.sin(a) * 0.026, 0.010, -0.152];
      tail.membrane([
        base,
        [Math.sin(a) * 0.094, 0.015, -0.152 - Math.cos(a) * 0.078],
        [Math.sin(a) * 0.063, 0.008, -0.152 - Math.cos(a) * 0.123]
      ], i % 2 === 0 ? red : cream);
    }
    /* 步足：每侧 4 条，末端细尖 */
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < 4; i++) {
        const z = 0.120 - i * 0.036;
        legs.tube([
          [s * 0.036, 0.016, z],
          [s * 0.072, 0.004, z - 0.028],
          [s * 0.094, -0.004, z - 0.062]
        ], [0.0065, 0.0046, 0.0026], i % 2 ? cream : white, i % 2 ? cream : white, 6, null, (i + (s > 0 ? 0.5 : 0)) * Math.PI);
      }
    }
    /* 腹足：每侧 3 对，小膜片 */
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < 3; i++) {
        const z = 0.030 - i * 0.038;
        legs.membrane([
          [s * 0.020, 0.018, z],
          [s * 0.062, 0.006, z - 0.020],
          [s * 0.030, 0.010, z - 0.034]
        ], cream, (i + (s > 0 ? 0.5 : 0)) * Math.PI + 0.9);
      }
    }
    /* 触须：两对，长而外弯 */
    for (let s = -1; s <= 1; s += 2) {
      ant.tube([
        [s * 0.016, 0.044, 0.236],
        [s * 0.070, 0.062, 0.320],
        [s * 0.160, 0.078, 0.478],
        [s * 0.245, 0.084, 0.615]
      ], [0.0038, 0.0030, 0.0022, 0.0016], white, white, 5, null, s > 0 ? 0 : 1.4);
      ant.tube([
        [s * 0.020, 0.040, 0.230],
        [s * 0.066, 0.034, 0.300],
        [s * 0.112, 0.030, 0.380]
      ], [0.0030, 0.0022, 0.0014], cream, cream, 5, null, s > 0 ? 0.6 : 2.0);
    }

    const g = new THREE.Group();
    const solid = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.42, metalness: 0.02, side: THREE.DoubleSide
    });
    const thin = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.50, transparent: true, opacity: 0.90,
      side: THREE.DoubleSide, depthWrite: false
    });
    const legMat = swayMat(new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.45, metalness: 0.02, side: THREE.DoubleSide
    }), 7.4, 0.014, false);
    const antMat = swayMat(new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.40, metalness: 0.02, side: THREE.DoubleSide
    }), 3.0, 0.052, true);
    const bodyMesh = new THREE.Mesh(body.geo(), solid);
    const legMesh = new THREE.Mesh(legs.geo(), legMat);
    const antMesh = new THREE.Mesh(ant.geo(), antMat);
    const tailMesh = new THREE.Mesh(tail.geo(), thin);
    g.add(bodyMesh, legMesh, antMesh, tailMesh);
    g.userData.parts = {
      antMesh: antMesh, tailMesh: tailMesh, legMesh: legMesh, bodyMesh: bodyMesh,
      retract: [bodyMesh, legMesh, antMesh, tailMesh]
    };
    return g;
  }

  /* ---- 寄居蟹：螺旋壳、露出头胸、不对称双螯、粗步足 ---- */
  function buildHermitModel() {
    const shell = new Soup(), body = new Soup(), claw = new Soup(), legs = new Soup();
    const tan = 0xe2c096, brown = 0x5e3c20, cream = 0xf6e8d0, orange = 0xd87240, dark = 0x2a1810;

    /* 螺旋壳：由粗到细，带螺纹环 */
    const pts = [], radii = [];
    const RINGS = 9, PER = 7, TURN = 2.0;
    for (let i = 0; i <= RINGS * PER; i++) {
      const u = i / (RINGS * PER);
      const a = u * TURN * Math.PI * 2;
      const rad = 0.105 * (1 - u * 0.78) + 0.012;
      pts.push([Math.sin(a) * rad * 0.92, 0.075 + u * 0.115 + Math.sin(a) * 0.02, Math.cos(a) * rad * 1.15]);
      radii.push(0.042 * (1 - u * 0.55) + 0.010);
    }
    shell.tube(pts, radii, null, null, 10, function (i) {
      return new THREE.Color(Math.floor(i / PER) % 2 ? brown : tan);
    });
    /* 壳口：深色内壁 */
    shell.ellipsoid({ p: [0, 0.048, 0.148], r: [0.052, 0.040, 0.020], c: 0x2a1a12, su: 12, sv: 10 });
    shell.ellipsoid({ p: [0, 0.048, 0.160], r: [0.058, 0.046, 0.012], c: 0xe8cda4, su: 12, sv: 10 });

    /* 头胸：从壳口探出 */
    body.ellipsoid({ p: [0, 0.046, 0.196], r: [0.044, 0.030, 0.048], c: cream, su: 12, sv: 10 });
    /* 眼柄 + 复眼 */
    for (let s = -1; s <= 1; s += 2) {
      body.tube([[s * 0.018, 0.062, 0.222], [s * 0.024, 0.080, 0.238]], 0.0062, cream, cream, 6);
      body.ellipsoid({ p: [s * 0.026, 0.086, 0.244], r: [0.011, 0.011, 0.011], c: 0x121014, su: 8, sv: 7 });
      /* 触角 */
      body.tube([[s * 0.020, 0.052, 0.232], [s * 0.052, 0.040, 0.290], [s * 0.082, 0.034, 0.344]],
        [0.0034, 0.0024, 0.0014], cream, cream, 5);
    }
    /* 大螯（左）：粗腕 + 掌 + 两指 */
    claw.tube([[-0.030, 0.038, 0.192], [-0.072, 0.034, 0.216], [-0.100, 0.038, 0.248]],
      [0.018, 0.024, 0.030], cream, orange, 8);
    claw.ellipsoid({ p: [-0.122, 0.040, 0.280], r: [0.043, 0.034, 0.055], c: orange, su: 12, sv: 10 });
    claw.tube([[-0.096, 0.042, 0.300], [-0.116, 0.040, 0.344]], [0.016, 0.004], orange, dark, 6);
    claw.tube([[-0.104, 0.030, 0.286], [-0.128, 0.028, 0.326]], [0.013, 0.004], orange, dark, 6);
    /* 小螯（右） */
    claw.tube([[0.030, 0.038, 0.192], [0.062, 0.034, 0.212], [0.084, 0.038, 0.236]],
      [0.014, 0.018, 0.022], cream, orange, 8);
    claw.ellipsoid({ p: [0.100, 0.040, 0.262], r: [0.029, 0.024, 0.038], c: orange, su: 10, sv: 9 });
    claw.tube([[0.086, 0.042, 0.276], [0.104, 0.040, 0.310]], [0.011, 0.003], orange, dark, 6);
    /* 步足：每侧 3 条，粗壮带关节 */
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < 3; i++) {
        const z = 0.170 - i * 0.030;
        legs.tube([
          [s * 0.030, 0.032, z],
          [s * 0.062, 0.014, z - 0.026],
          [s * 0.072, 0.002, z - 0.062],
          [s * 0.094, -0.002, z - 0.086]
        ], [0.010, 0.0085, 0.0060, 0.0032], orange, dark, 6, null, (i + (s > 0 ? 0.5 : 0)) * Math.PI);
      }
    }

    const g = new THREE.Group();
    const solid = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.52, metalness: 0.02, side: THREE.DoubleSide
    });
    const legMat = swayMat(new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.52, metalness: 0.02, side: THREE.DoubleSide
    }), 6.2, 0.012, false);
    const shellMesh = new THREE.Mesh(shell.geo(), solid);
    const bodyMesh = new THREE.Mesh(body.geo(), solid);
    const clawMesh = new THREE.Mesh(claw.geo(), solid);
    const legMesh = new THREE.Mesh(legs.geo(), legMat);
    g.add(shellMesh, bodyMesh, clawMesh, legMesh);
    g.userData.parts = {
      shellMesh: shellMesh, bodyMesh: bodyMesh, clawMesh: clawMesh, legMesh: legMesh,
      retract: [bodyMesh, clawMesh, legMesh]
    };
    return g;
  }


  /* 备用空壳（可被寄居蟹换入） */
  let spareShellGeo = null;
  function makeSpareShellMesh(size) {
    if (!spareShellGeo) {
      const soup = new Soup();
      const pts = [], radii = [];
      const RINGS = 3, PER = 6, TURN = 1.5;
      for (let i = 0; i <= RINGS * PER; i++) {
        const u = i / (RINGS * PER);
        const a = u * TURN * Math.PI * 2;
        const rad = 0.088 * (1 - u * 0.70) + 0.010;
        pts.push([Math.sin(a) * rad * 0.9, 0.034 + u * 0.092, Math.cos(a) * rad]);
        radii.push(0.024 * (1 - u * 0.50) + 0.007);
      }
      soup.tube(pts, radii, null, null, 6, function (i) {
        return new THREE.Color(Math.floor(i / PER) % 2 ? 0x8a6a48 : 0xd8b88a);
      });
      spareShellGeo = soup.geo();
      SHARED_GEOS.add(spareShellGeo);
    }
    const m = new THREE.Mesh(spareShellGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, side: THREE.DoubleSide }));
    m.scale.setScalar(size);
    return m;
  }

  function spawnFish(id, x, z, opts) {
    const st = fishState[id];
    if (!st) return null;
    if (fishList.length >= FISH_MAX) {
      if (!(opts && opts.silent)) toast('鱼已经到上限了（32 条）');
      return null;
    }
    const sp = SPECIES[id];
    let cur = 0;
    for (let i = 0; i < fishList.length; i++) if (fishList[i].id === id) cur++;
    if (cur >= sp.cap) {
      if (!(opts && opts.silent)) toast(sp.name + ' 最多 ' + sp.cap + ' 条');
      return null;
    }
    const v = st.v;
    const f = {
      id: id, v: v, name: sp.name,
      x: x, z: z,
      y: (id === 'goby' ? -0.60 : -0.36) - Math.random() * (id === 'goby' ? 0.05 : 0.18),
      heading: Math.random() * 6.283,
      speed: v.speed * 0.6,
      phase: Math.random() * 6.283,
      roll: 0,
      modeT: 1.5 + Math.random() * 2.5,
      orbit: Math.random() * 6.283,
      orbitDir: Math.random() < 0.5 ? -1 : 1,
      orbitR: 0.85 + Math.random() * 0.62,
      orbitSpd: 0.17 + Math.random() * 0.16,
      dip: 0, foodLock: null, stuck: 0,
      temper: 0.82 + Math.random() * 0.38,
      targetX: x, targetZ: z, speedTarget: v.speed,
      fleeX: x, fleeZ: z,
      scared: 0, hidden: 0, dragging: false, hideMix: 0, canHide: false,
      wp: 0,
      homeX: x, homeZ: z,
      dirty: 8 + Math.random() * 30,   /* 距离需要清洁还有多久 */
      cleanT: 0                        /* 正在被清洁的进度 */
    };
    if (id === 'clown') { const a = nearestAnemone(x, z); f.homeX = a.x; f.homeZ = a.z; }
    if (id === 'goby' || id === 'damsel') {
      const r = nearestRock(x, z);
      f.homeX = r.x + r.r * 0.55;
      f.homeZ = r.z + r.r * 0.35;
    }
    fishList.push(f);
    updateFishCount();
    if (!(opts && opts.silent)) {
      addRipple(x, z, 0.35, 0.45);
      toast(sp.name + ' 入水');
    }
    return f;
  }

  function spawnInitialFish() {
    spawnFish('clown', -2.3, 1.5, { silent: true });
    spawnFish('clown', -1.4, 2.2, { silent: true });
    spawnFish('tang', 3.6, -0.6, { silent: true });
    spawnFish('damsel', 0.9, -1.2, { silent: true });
    spawnFish('goby', -0.6, -2.3, { silent: true });
    spawnFish('firefish', -1.2, -1.3, { silent: true });
    spawnInvert('cleaner', 1.4, -1.7, { silent: true });
    spawnInvert('cleaner', -3.8, 2.6, { silent: true });
    spawnInvert('hermit', -2.1, -2.5, { silent: true });
    updateFishCount();
  }

  /* ---- 无脊椎生成 / 移除 ---- */
  function spawnInvert(id, x, z, opts) {
    const sp = SPECIES[id];
    if (!sp || sp.kind === 'fish') return null;
    let cur = 0;
    for (let i = 0; i < invertList.length; i++) if (invertList[i].id === id) cur++;
    if (cur >= sp.cap) {
      if (!(opts && opts.silent)) toast(sp.name + ' 最多 ' + sp.cap + ' 只');
      return null;
    }
    const group = id === 'cleaner' ? buildShrimpModel() : buildHermitModel();
    group.traverse(function (o) { o.layers.set(1); });
    /* 缸内放大：无脊椎本体很小，不放大会看不见 */
    group.scale.setScalar(id === 'cleaner' ? 1.5 : 1.35);
    invertRoot.add(group);
    const c = {
      id: id, kind: sp.kind, name: sp.name,
      x: x, z: z, y: floorHeight(x, z) + 0.02,
      heading: Math.random() * 6.283,
      speed: 0, speedTarget: 0.1,
      phase: Math.random() * 6.283,
      mode: 'wander', timer: 1 + Math.random() * 2,
      scared: 0, hidden: 0, dragging: false, hideMix: 0, canHide: false,
      cover: null, targetFish: null, attached: false,
      targetX: x, targetZ: z, wanderY: -0.12,
      retractAmt: 0,
      patch: null, shellTarget: null, shellSize: 0.85 + Math.random() * 0.25,
      group: group, parts: group.userData.parts
    };
    if (id === 'hermit') c.parts.shellMesh.scale.setScalar(c.shellSize);
    invertList.push(c);
    updateFishCount();
    if (!(opts && opts.silent)) {
      addRipple(x, z, 0.28, 0.40);
      toast(sp.name + ' 入缸');
      sfx.play('splash', 0.45);
    }
    return c;
  }

  function removeInvert(c) {
    const i = invertList.indexOf(c);
    if (i >= 0) invertList.splice(i, 1);
    if (invertRoot) invertRoot.remove(c.group);
    c.group.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
    /* 释放它占据的备用壳 */
    for (const s of spareShells) {
      if (s.owner === c) { s.owner = null; s.mesh.visible = true; s.occupied = false; }
    }
    updateFishCount();
  }

  /* 统一投放入口：鱼 → fishList，虾蟹 → invertList */
  function spawnCreature(id, x, z, opts) {
    const sp = SPECIES[id];
    if (!sp) return null;
    if (sp.kind === 'fish') return spawnFish(id, x, z, opts);
    return spawnInvert(id, x, z, opts);
  }

  function removeFish(f) {
    const i = fishList.indexOf(f);
    if (i >= 0) fishList.splice(i, 1);
    updateFishCount();
  }

  function updateFishCount() {
    const n = fishList.length;
    const m = invertList.length;
    const fc = $('fishCount'); if (fc) fc.textContent = String(n);
    const cc = $('crabCount'); if (cc) cc.textContent = String(m);
    const dt = $('drawerTotal'); if (dt) dt.textContent = (n + m) + ' / 48';
    const cards = document.querySelectorAll('.card');
    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const id = card.dataset.id;
      if (!id) continue;
      const el = card.querySelector('.ct');
      if (!el) continue;
      let n2 = 0;
      for (let j = 0; j < fishList.length; j++) if (fishList[j].id === id) n2++;
      for (let j = 0; j < invertList.length; j++) if (invertList[j].id === id) n2++;
      el.textContent = String(n2);
    }
  }

  function isFreeSpot(x, z) {
    if (Math.abs(x) > 7.2 || Math.abs(z) > 3.9) return false;
    if (Math.hypot(x - SCENERY_LAYOUT.platform.x, z - SCENERY_LAYOUT.platform.z) < 2.2) return false;
    for (let i = 0; i < SCENERY_LAYOUT.rocks.length; i++) {
      const r = SCENERY_LAYOUT.rocks[i];
      if (Math.hypot(x - r.x, z - r.z) < r.r * 0.95) return false;
    }
    return true;
  }

  function findFreeSpot() {
    for (let i = 0; i < 40; i++) {
      const x = (Math.random() * 2 - 1) * 6.2;
      const z = (Math.random() * 2 - 1) * 3.2;
      if (isFreeSpot(x, z)) return { x: x, z: z };
    }
    return { x: 0.5, z: 0 };
  }

  function nearestFish(x, z, r) {
    let best = null, bd = r * r;
    for (let i = 0; i < fishList.length; i++) {
      const f = fishList[i];
      if (f.dragging || f.hidden > 0) continue;
      const dx = f.x - x, dz = f.z - z;
      const d2 = dx * dx + dz * dz;
      if (d2 < bd) { bd = d2; best = f; }
    }
    return best;
  }

  /* 鱼 + 虾蟹一起搜（戳弄 / 拖拽用） */
  function nearestCreature(x, z, r) {
    let best = nearestFish(x, z, r);
    let bd = best ? (best.x - x) * (best.x - x) + (best.z - z) * (best.z - z) : r * r;
    for (let i = 0; i < invertList.length; i++) {
      const c = invertList[i];
      if (c.dragging || c.hidden > 0) continue;
      const dx = c.x - x, dz = c.z - z;
      const d2 = dx * dx + dz * dz;
      if (d2 < bd) { bd = d2; best = c; }
    }
    return best;
  }

  function scareFish(x, z, radius, power, allowHide) {
    const r2 = radius * radius;
    for (let i = 0; i < fishList.length; i++) {
      const f = fishList[i];
      if (f.dragging) continue;
      const dx = f.x - x, dz = f.z - z;
      const d2 = dx * dx + dz * dz;
      if (d2 > r2) continue;
      f.scared = 1.6 + Math.random() * 0.8;
      f.canHide = allowHide === true;
      f.modeT = 0;
      if (f.id === 'clown' || f.id === 'goby') {
        f.fleeX = f.homeX; f.fleeZ = f.homeZ;
      } else {
        const d = Math.sqrt(d2) + 0.001;
        f.fleeX = clamp(f.x + dx / d * 3.2, -7.2, 7.2);
        f.fleeZ = clamp(f.z + dz / d * 3.2, -3.9, 3.9);
      }
    }
    /* 虾蟹：逃回石头缝 */
    for (let i = 0; i < invertList.length; i++) {
      const c = invertList[i];
      if (c.dragging) continue;
      const dx = c.x - x, dz = c.z - z;
      if (dx * dx + dz * dz > r2) continue;
      c.scared = 1.8 + Math.random();
      c.canHide = allowHide === true;
      const dd = Math.sqrt(dx * dx + dz * dz) + 0.001;
      c.fleeX = clamp(c.x + dx / dd * 1.5, -7.0, 7.0);
      c.fleeZ = clamp(c.z + dz / dd * 1.5, -3.8, 3.8);
      if (allowHide === true) { c.cover = null; c.mode = 'hide'; c.timer = 0; }
      c.targetFish = null; c.attached = false;
    }
  }

  /* 敲缸：双击玻璃 */
  function doKnock(cx, cy) {
    const p = waterPoint(cx, cy);
    const kx = p ? p.x : 0, kz = p ? p.z : 0;
    scareFish(kx, kz, 10, 1.5, true);
    addRipple(kx, kz, 1.5, 1.0);
    sfx.play('knock');
    Bus.emit('tank:knock', { x: kx, z: kz });
  }

  function feed() {
    if (foodList.length > 26) { toast('饲料已经够多了'); return; }
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * 6.283;
      const r = Math.sqrt(Math.random()) * 2.4;
      foodList.push({
        x: clamp(1.2 + Math.cos(a) * r, -6.6, 6.6),
        z: clamp(0.2 + Math.sin(a) * r, -3.5, 3.5),
        y: 0.34,
        landed: false,
        age: 0,
        rot: false,
        seed: Math.random() * 6.283,
        tilt: (Math.random() - 0.5) * 0.9,
        size: 0.8 + Math.random() * 0.45,
        color: new THREE.Color().setHSL(0.085 + Math.random() * 0.03, 0.62, 0.52)
      });
    }
    toast('投下饲料');
    sfx.play('sprinkle', 0.8);
    Bus.emit('feed', {});
  }

  function eatFood(fd, f) {
    const i = foodList.indexOf(fd);
    if (i >= 0) foodList.splice(i, 1);
    addRipple(fd.x, fd.z, 0.20, 0.30);
    burstSparks(fd.x, fd.y + 0.02, fd.z, 6);
    if (f) f.modeT = 0.6;
  }

  function fishThink(f, dt, t) {
    const v = f.v;
    f.modeT -= dt;
    if (f.modeT <= 0) {
      f.modeT = 2.4 + Math.random() * 3.0;
      f.orbit = Math.random() * 6.283;
    }
    let tx = f.targetX, tz = f.targetZ, sp = v.speed;

    let fd = null;
    if (f.scared <= 0 && foodList.length) {
      /* 锁定目标：吃掉或消失前不换，避免在两条饲料之间来回打转 */
      if (f.foodLock && foodList.indexOf(f.foodLock) >= 0) {
        fd = f.foodLock;
      } else {
        f.foodLock = null;
        let bd = 36;
        for (let i = 0; i < foodList.length; i++) {
          const q = foodList[i];
          if (!q.landed) continue;
          /* 已经有别的鱼占住的不抢 */
          if (q.owner && q.owner !== f && fishList.indexOf(q.owner) >= 0) continue;
          const dx = q.x - f.x, dz = q.z - f.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < bd) { bd = d2; fd = q; }
        }
        if (fd) { fd.owner = f; f.foodLock = fd; }
      }
    }

    if (fd) {
      /* 每条鱼在饲料周围取自己的角度，围成一圈啄食，不再怼成一点 */
      const rr = 0.20;
      const ang = f.phase * 1.7;
      tx = fd.x + Math.cos(ang) * rr;
      tz = fd.z + Math.sin(ang) * rr;
      sp = v.speed * 1.7;
      if (Math.hypot(fd.x - f.x, fd.z - f.z) < 0.30) { eatFood(fd, f); f.foodLock = null; }
    } else if (f.scared > 0) {
      if (f.id === 'clown' || f.id === 'goby') {
        /* 受惊就往掩体靠，但不会再"钻进去消失"——在附近绕圈，视觉上才合理 */
        const ang = f.phase + t * 0.9;
        tx = f.homeX + Math.cos(ang) * 0.62;
        tz = f.homeZ + Math.sin(ang) * 0.62;
        sp = v.speed * 1.9;
      } else {
        tx = f.fleeX; tz = f.fleeZ; sp = v.speed * 2.1;
      }
    } else if (f.id === 'clown') {
      /* 每条鱼有自己的半径/角速度/绕向，否则两条会挤在同一个圆上打转 */
      const dir = f.orbitDir || 1;
      const rad = (f.orbitR || 1.15) + Math.sin(t * 0.19 + f.phase) * 0.16;
      const ang = f.orbit + t * (f.orbitSpd || 0.24) * dir;
      tx = f.homeX + Math.cos(ang) * rad;
      tz = f.homeZ + Math.sin(ang) * rad;
      sp = v.speed * 0.92;
    } else if (f.id === 'tang') {
      const wp = TANG_PATH[f.wp % TANG_PATH.length];
      if (Math.hypot(wp.x - f.x, wp.z - f.z) < 0.75) f.wp = (f.wp + 1) % TANG_PATH.length;
      tx = wp.x; tz = wp.z; sp = v.speed * 1.15;
    } else if (f.id === 'damsel') {
      tx = f.homeX + Math.cos(f.orbit) * 0.9;
      tz = f.homeZ + Math.sin(f.orbit) * 0.9;
      sp = v.speed * 0.45;
      let intr = null, bd = 2.2;
      for (let i = 0; i < fishList.length; i++) {
        const o = fishList[i];
        if (o === f || o.id === 'damsel' || o.dragging || o.hidden > 0) continue;
        const d2 = (o.x - f.homeX) * (o.x - f.homeX) + (o.z - f.homeZ) * (o.z - f.homeZ);
        if (d2 < bd) { bd = d2; intr = o; }
      }
      if (intr) { tx = intr.x; tz = intr.z; sp = v.speed * 1.7; }
    } else if (f.id === 'goby') {
      tx = f.homeX + Math.sin(t * 0.26 + f.phase) * 0.32;
      tz = f.homeZ + Math.cos(t * 0.21 + f.phase) * 0.28;
      sp = v.speed * 0.35;
      if (f.scared > 0) {
        tx = f.homeX; tz = f.homeZ; sp = v.speed * 1.9;
        if (f.canHide === true && Math.hypot(f.x - f.homeX, f.z - f.homeZ) < 0.3) f.hidden = 1.3;
      }
    } else if (f.id === 'firefish') {
      let cx = 0, cz = 0, n = 0;
      for (let i = 0; i < fishList.length; i++) {
        const o = fishList[i];
        if (o.id !== 'firefish' || o.dragging || o.hidden > 0) continue;
        cx += o.x; cz += o.z; n++;
      }
      if (n) { cx /= n; cz /= n; } else { cx = f.x; cz = f.z; }
      tx = cx + Math.cos(f.phase + t * 0.45) * 0.42;
      tz = cz + Math.sin(f.phase + t * 0.45) * 0.42;
      sp = v.speed;
    }

    if (f.id === 'clown' && f.scared <= 0) {
      let cx = 0, cz = 0, n = 0;
      for (let i = 0; i < fishList.length; i++) {
        const o = fishList[i];
        if (o.id !== 'clown' || o === f || o.dragging || o.hidden > 0) continue;
        cx += o.x; cz += o.z; n++;
      }
      if (n) {
        tx = tx * 0.65 + (cx / n) * 0.35;
        tz = tz * 0.65 + (cz / n) * 0.35;
      }
    }

    /* 目标点落在石头里就往回拉，避免一直顶着石头打转 */
    for (let i = 0; i < SCENERY_LAYOUT.rocks.length; i++) {
      const r = SCENERY_LAYOUT.rocks[i];
      const dx = tx - r.x, dz = tz - r.z;
      const rr = r.r * 0.95 + 0.30;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr) {
        const d = Math.sqrt(d2) + 1e-4;
        tx = r.x + dx / d * rr;
        tz = r.z + dz / d * rr;
      }
    }

    /* 邻居排斥：目标点先被邻居推开，鱼才会真的绕行而不是头顶头硬顶 */
    let repX = 0, repZ = 0;
    for (let i = 0; i < fishList.length; i++) {
      const o = fishList[i];
      if (o === f || o.dragging || o.hidden > 0) continue;
      const ox = f.x - o.x, oz = f.z - o.z;
      const d = Math.hypot(ox, oz);
      if (d > 1.15 || d < 1e-3) continue;
      const w = (1.15 - d) / 1.15;
      repX += ox / d * w;
      repZ += oz / d * w;
    }
    tx += repX * 1.25;
    tz += repZ * 1.25;

    /* 提前一身体长把目标收回边界内，鱼就不会一路冲到缸壁再原地掉头 */
    const mMargin = 1.05;
    if (Math.abs(tx) > 7.15 - mMargin) tx = Math.sign(tx) * (7.15 - mMargin);
    if (Math.abs(tz) > 3.95 - mMargin) tz = Math.sign(tz) * (3.95 - mMargin);
    f.targetX = clamp(tx, -7.05, 7.05);
    f.targetZ = clamp(tz, -3.85, 3.85);
    f.speedTarget = sp;
  }

  function moveFish(f, dt) {
    /* 前方避让：有邻居挡在前进方向上就侧身绕开，而不是硬顶着推 */
    let avoid = 0;
    for (let i = 0; i < fishList.length; i++) {
      const o = fishList[i];
      if (o === f || o.dragging || o.hidden > 0) continue;
      const ox = o.x - f.x, oz = o.z - f.z;
      const d = Math.hypot(ox, oz);
      if (d > 0.95 || d < 1e-3) continue;
      let da = Math.atan2(ox, oz) - f.heading;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) < 1.15) avoid += (da > 0 ? -1 : 1) * (1 - d / 0.95);
    }
    if (avoid !== 0) {
      f.heading += clamp(avoid * 3.2 * dt, -2.6 * dt, 2.6 * dt);
    }

    /* 群游对齐：同种伙伴的朝向会互相拉近，队伍才不会各游各的 */
    if (f.id === 'clown' || f.id === 'firefish') {
      let ax = 0, az = 0, an = 0;
      for (let i = 0; i < fishList.length; i++) {
        const o = fishList[i];
        if (o === f || o.id !== f.id || o.dragging || o.hidden > 0) continue;
        if (Math.hypot(o.x - f.x, o.z - f.z) > 1.7) continue;
        ax += Math.sin(o.heading); az += Math.cos(o.heading); an++;
      }
      if (an > 0) {
        const avg = Math.atan2(ax / an, az / an);
        let da2 = avg - f.heading;
        while (da2 > Math.PI) da2 -= Math.PI * 2;
        while (da2 < -Math.PI) da2 += Math.PI * 2;
        f.heading += clamp(da2 * 0.85 * dt, -1.1 * dt, 1.1 * dt);
      }
    }

    const dx = f.targetX - f.x, dz = f.targetZ - f.z;
    const dist = Math.hypot(dx, dz);
    const desired = Math.atan2(dx, dz);
    let diff = desired - f.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;

    /* 靠近目标先减速：鱼会悬停，而不是绕着目标划圈 */
    const arrive = Math.min(1, dist / 0.60);
    let want = f.speedTarget * (f.temper || 1) * (0.18 + 0.82 * arrive);
    if (dist < 0.16 && f.scared <= 0) want = 0.02;

    /* 转弯率随"要转的角度"衰减：急转必须先减速，不能原地拧身 */
    const baseTurn = f.scared > 0 ? 5.2 : 2.35;
    const turnRate = baseTurn * (1 - 0.42 * Math.min(1, Math.abs(diff) / Math.PI));
    const turnMax = turnRate * dt;
    const step = clamp(diff, -turnMax, turnMax);
    f.heading += step;

    /* 侧倾跟的是转向角速度，不是角度差——对准之后就不该再侧着 */
    const yawRate = dt > 1e-5 ? step / dt : 0;
    const targetRoll = clamp(-yawRate * 0.085, -0.24, 0.24);
    f.roll += (targetRoll - f.roll) * Math.min(1, dt * 6);

    /* 加速慢、减速快（用鳍刹车） */
    const accK = want > f.speed ? 2.0 : 5.0;
    f.speed += (want - f.speed) * Math.min(1, dt * accK);

    let nx = f.x + Math.sin(f.heading) * f.speed * dt;
    let nz = f.z + Math.cos(f.heading) * f.speed * dt;

    const mx = 7.15, mz = 3.95;
    if (nx < -mx || nx > mx) { f.heading += Math.PI * 0.5; nx = clamp(nx, -mx, mx); f.modeT = 0; }
    if (nz < -mz || nz > mz) { f.heading += Math.PI * 0.5; nz = clamp(nz, -mz, mz); f.modeT = 0; }

    for (let i = 0; i < SCENERY_LAYOUT.rocks.length; i++) {
      const r = SCENERY_LAYOUT.rocks[i];
      const ddx = nx - r.x, ddz = nz - r.z;
      const rr = r.r * 0.9 + 0.2;
      const d2 = ddx * ddx + ddz * ddz;
      if (d2 < rr * rr) {
        const d = Math.sqrt(d2) + 0.001;
        nx = r.x + ddx / d * rr;
        nz = r.z + ddz / d * rr;
      }
    }

    const px = nx - SCENERY_LAYOUT.platform.x;
    const pz = nz - SCENERY_LAYOUT.platform.z;
    const pd = Math.sqrt(px * px + pz * pz);
    if (pd < 2.15) {
      const kk = 2.15 / Math.max(pd, 0.001);
      nx = SCENERY_LAYOUT.platform.x + px * kk;
      nz = SCENERY_LAYOUT.platform.z + pz * kk;
    }

    const movedD = Math.hypot(nx - f.x, nz - f.z);
    f.x = nx;
    f.z = nz;
    /* 卡死自解：有速度意愿却几乎没位移，就随机转弯 */
    if (f.speed > 0.12 && movedD < f.speed * dt * 0.35) {
      f.stuck = (f.stuck || 0) + dt;
      if (f.stuck > 0.75) {
        f.heading += (Math.random() - 0.5) * 2.8;
        f.stuck = 0;
        f.modeT = 0;
      }
    } else {
      f.stuck = 0;
    }
    /* 造流轻推 */
    const fl0 = flowVec();
    f.x = clamp(f.x + fl0.x * 0.018 * dt, -7.15, 7.15);
    f.z = clamp(f.z + fl0.y * 0.018 * dt, -3.95, 3.95);
  }

  /* 硬分离：把重叠的生物两两推开（鱼×鱼、鱼×虾蟹、虾蟹×虾蟹） */
  function separateAll() {
    const bodies = [];
    for (let i = 0; i < fishList.length; i++) {
      const f = fishList[i];
      if (f.dragging || f.hidden > 0) continue;
      bodies.push({ o: f, r: 0.33 * (f.v ? f.v.len : 1) });
    }
    for (let i = 0; i < invertList.length; i++) {
      const c = invertList[i];
      if (c.dragging || c.hidden > 0) continue;
      bodies.push({ o: c, r: c.kind === 'shrimp' ? 0.21 : 0.25 });
    }
    for (let it = 0; it < 2; it++) {
      for (let i = 0; i < bodies.length; i++) {
        const A = bodies[i];
        for (let j = i + 1; j < bodies.length; j++) {
          const B = bodies[j];
          const dx = B.o.x - A.o.x, dz = B.o.z - A.o.z;
          /* 同向并排是自然的，允许靠得近；对面来的一定要分开 */
          let same = false;
          if (typeof A.o.heading === 'number' && typeof B.o.heading === 'number') {
            same = Math.cos(A.o.heading - B.o.heading) > 0.6;
          }
          const md = (A.r + B.r) * (same ? 0.70 : 1.12);
          let d2 = dx * dx + dz * dz;
          if (d2 >= md * md) continue;
          let d = Math.sqrt(d2), ux, uz;
          if (d < 1e-4) {
            const a = Math.random() * 6.283;
            ux = Math.cos(a); uz = Math.sin(a); d = 1e-4;
          } else { ux = dx / d; uz = dz / d; }
          const push = (md - d) * 0.5;
          A.o.x -= ux * push; A.o.z -= uz * push;
          B.o.x += ux * push; B.o.z += uz * push;
        }
      }
    }
    for (let i = 0; i < bodies.length; i++) {
      bodies[i].o.x = clamp(bodies[i].o.x, -7.15, 7.15);
      bodies[i].o.z = clamp(bodies[i].o.z, -3.95, 3.95);
    }
  }

  function updateFish(dt, t) {
    fishTime.value = t;
    const by = {};
    const shDummy = new THREE.Object3D();
    const dummy = new THREE.Object3D();
    let shI = 0;

    for (let i = 0; i < fishList.length; i++) {
      const f = fishList[i];
      f.scared = Math.max(0, f.scared - dt);
      /* 清洁度：脏了等虾来，被清洁时累积 */
      if (!f.dragging && f.hidden <= 0) {
        if (f.dirty > 0) f.dirty -= dt;
        if (f.cleanT > 0) f.cleanT = Math.max(0, f.cleanT - dt * 0.12);
      }
      if (!f.dragging) {
        if (f.hidden > 0) {
          f.hidden -= dt;
          if (f.hidden <= 0) { f.hidden = 0; f.scared = 0; }
        }
        if (f.hidden <= 0) {
          fishThink(f, dt, t);
          moveFish(f, dt);
        }
      }
      if (!by[f.id]) by[f.id] = [];
      by[f.id].push(f);

      if (fishShadowMesh && !f.dragging && f.hidden <= 0 && shI < FISH_MAX + INVERT_MAX * 2) {
        shDummy.position.set(f.x + 0.14, floorHeight(f.x, f.z) + 0.022, f.z + 0.20);
        shDummy.rotation.set(0, 0, 0);
        shDummy.scale.set(0.92 * f.v.len, 1, 0.62 * f.v.len);
        shDummy.updateMatrix();
        fishShadowMesh.setMatrixAt(shI, shDummy.matrix);
        shI++;
      }
    }

    for (const id in fishState) {
      const st = fishState[id];
      const arr = by[id] || [];
      st.bodyMesh.count = arr.length;
      st.finMesh.count = arr.length;
      st.caudalMesh.count = arr.length;
      st.eyeMesh.count = arr.length;
      for (let i = 0; i < arr.length; i++) {
        const f = arr[i];
        const hideT = (f.dragging || f.hidden > 0) ? 1 : 0;
        f.hideMix = (f.hideMix || 0) + (hideT - (f.hideMix || 0)) * Math.min(1, dt * 11);
        const scF = f.v.scale * (1 - f.hideMix);
        /* 受惊时下沉，贴到底床附近 */
        const dipT = f.scared > 0 ? 1 : 0;
        f.dip = (f.dip || 0) + (dipT - (f.dip || 0)) * Math.min(1, dt * 2.2);
        /* 缓慢的上下漂 + 随浮沉轻微俯仰，避免所有鱼"贴在同一水平面上平移" */
        const bobY = Math.sin(t * 0.33 + f.phase) * 0.045 + Math.sin(t * 1.5 + f.phase) * 0.012;
        const pitch = Math.cos(t * 0.33 + f.phase) * 0.11;
        dummy.position.set(f.x, f.y - (f.dip || 0) * 0.14 + bobY, f.z);
        dummy.rotation.set(0, f.heading, 0);
        dummy.rotateX(pitch);
        dummy.rotateZ(f.roll);
        dummy.scale.setScalar(scF > 0.006 ? scF : 0);
        dummy.updateMatrix();
        st.bodyMesh.setMatrixAt(i, dummy.matrix);
        st.finMesh.setMatrixAt(i, dummy.matrix);
        st.caudalMesh.setMatrixAt(i, dummy.matrix);
        st.eyeMesh.setMatrixAt(i, dummy.matrix);
        /* 速度系数 (0..1.8) 与转弯弯曲 (-1..1) 喂给出鳍的摆动 shader */
        const spdK = Math.min(1.8, f.speed / Math.max(0.18, f.v.speed));
        const bendK = clamp(-(f.roll || 0) * 2.4, -0.9, 0.9);
        const i3 = i * 3;
        st.bodyPhase.array[i3] = f.phase;
        st.bodyPhase.array[i3 + 1] = spdK;
        st.bodyPhase.array[i3 + 2] = bendK;
        st.finPhase.array[i3] = f.phase;
        st.finPhase.array[i3 + 1] = spdK;
        st.finPhase.array[i3 + 2] = bendK;
        st.caudalPhase.array[i3] = f.phase;
        st.caudalPhase.array[i3 + 1] = spdK;
        st.caudalPhase.array[i3 + 2] = bendK;
      }
      st.bodyMesh.instanceMatrix.needsUpdate = true;
      st.finMesh.instanceMatrix.needsUpdate = true;
      st.caudalMesh.instanceMatrix.needsUpdate = true;
      st.eyeMesh.instanceMatrix.needsUpdate = true;
      st.bodyPhase.needsUpdate = true;
      st.finPhase.needsUpdate = true;
      st.caudalPhase.needsUpdate = true;
    }

    if (fishShadowMesh) {
      fishShadowMesh.count = shI;
      fishShadowMesh.instanceMatrix.needsUpdate = true;
    }
  }

  function updateFood(dt, t) {
    if (!foodMesh) return;
    if (!ROT_COLOR_A) { ROT_COLOR_A = new THREE.Color(0x6b5a34); ROT_COLOR_B = new THREE.Color(0x3f4a22); }
    const dummy = new THREE.Object3D();
    const col = new THREE.Color();
    const fl = flowVec();
    for (let i = 0; i < foodList.length; i++) {
      const fd = foodList[i];
      fd.age += dt;
      if (!fd.landed) {
        fd.y -= dt * 0.55;
        fd.x += (Math.sin(t * 2 + fd.seed) * 0.02 + fl.x * 0.05) * dt;
        fd.z += (Math.cos(t * 1.7 + fd.seed) * 0.02 + fl.y * 0.05) * dt;
        const fh = floorHeight(fd.x, fd.z) + 0.012;
        if (fd.y <= fh) {
          fd.y = fh;
          fd.landed = true;
          addRipple(fd.x, fd.z, 0.18, 0.30);
        }
      } else {
        if (!fd.rot && fd.age > 16) fd.rot = true;
        if (fd.rot) {
          fd.x += fl.x * 0.02 * dt;
          fd.z += fl.y * 0.02 * dt;
        }
        if (fd.age > 70) { foodList.splice(i, 1); i--; continue; }
      }
      dummy.position.set(fd.x, fd.y, fd.z);
      dummy.rotation.set(fd.tilt, t * 0.6 + fd.seed, fd.tilt * 0.7);
      const sc = (fd.landed ? 1 : 0.75) * fd.size;
      dummy.scale.setScalar(sc);
      dummy.updateMatrix();
      foodMesh.setMatrixAt(i, dummy.matrix);
      if (fd.rot) col.copy(ROT_COLOR_A).lerp(ROT_COLOR_B, 0.5 + 0.5 * Math.sin(t * 0.5 + fd.seed));
      else col.copy(fd.color);
      foodMesh.setColorAt(i, col);
    }
    foodMesh.count = foodList.length;
    foodMesh.instanceMatrix.needsUpdate = true;
    if (foodMesh.instanceColor) foodMesh.instanceColor.needsUpdate = true;
  }

  let ROT_COLOR_A = null, ROT_COLOR_B = null;

  function showGhost(id, x, z, heading, phase) {
    if (!surfaceFx || !SPECIES[id]) return null;
    hideGhost();
    const group = buildModelGroup(id, phase);
    group.traverse(function (o) { o.layers.set(1); });
    /* 贴着水面拖动，而不是悬在半空 */
    group.position.set(x, 0.06, z);
    group.rotation.y = (typeof heading === 'number') ? heading : Math.random() * 6.283;
    surfaceFx.add(group);
    ghostMesh = group;
    return group;
  }

  function hideGhost() {
    if (!ghostMesh) return;
    if (surfaceFx) surfaceFx.remove(ghostMesh);
    disposeGroup(ghostMesh);
    ghostMesh = null;
  }

  /* =========================================================================
     ④d 无脊椎行为 + 水体特效 + 水质生态
     ========================================================================= */

  /* ---- 水流向量 ---- */
  function flowVec() {
    if (!state.flow.on) return { x: 0, y: 0 };
    return { x: Math.cos(state.flow.dir) * state.flow.strength, y: Math.sin(state.flow.dir) * state.flow.strength };
  }

  function setFlowPos(x, z) {
    state.flow.x = clamp(x, -7.0, 7.0);
    state.flow.z = clamp(z, -3.6, 3.6);
    if (flowMarker) flowMarker.position.set(state.flow.x, floorHeight(state.flow.x, state.flow.z) + 0.02, state.flow.z);
  }

  function toggleFlow() {
    state.flow.on = !state.flow.on;
    const btn = document.querySelector('[data-action="flow"]');
    if (btn) btn.classList.toggle('on', state.flow.on);
    toast(state.flow.on ? '造流开了 · 拖动水面移动出水口' : '造流关了');
    if (flowMarker) flowMarker.visible = state.flow.on;
    Bus.emit('flow:toggle', state.flow.on);
  }

  function toggleBubbles() {
    state.bubblesOn = !state.bubblesOn;
    const btn = document.querySelector('[data-action="bubble"]');
    if (btn) btn.classList.toggle('on', state.bubblesOn);
    toast(state.bubblesOn ? '气泡石打开了' : '气泡石关了');
    Bus.emit('bubbles:toggle', state.bubblesOn);
  }

  function toggleSound() {
    const ok = sfx.setEnabled(!sfx.enabled);
    state.soundOn = sfx.enabled;
    const btn = document.querySelector('[data-action="sound"]');
    if (btn) btn.classList.toggle('on', sfx.enabled);
    toast(sfx.enabled ? '声音开了' : (ok ? '声音关了' : '浏览器不支持音频'));
  }

  /* ---- 换水 ---- */
  const POUR_POS = { x: 0.6, z: 2.55 };
  function pourWater() {
    if (state.pour) return;
    state.pour = { t: 0, dur: 3.4 };
    state.quality = 1;
    sfx.play('pour');
    /* 水滴初速 */
    for (let i = 0; i < dropList.length; i++) {
      const d = dropList[i];
      const a = Math.random() * 6.283;
      d.x = POUR_POS.x; d.z = POUR_POS.z; d.y = 0.05;
      d.vx = Math.cos(a) * (0.2 + Math.random() * 0.5);
      d.vz = Math.sin(a) * (0.2 + Math.random() * 0.5);
      d.vy = 0.5 + Math.random() * 0.8;
      d.life = 0.7 + Math.random() * 0.5;
      d.max = d.life;
    }
    toast('换水中……');
    Bus.emit('water:pour', {});
  }

  /* ---- 无脊椎行为 ---- */
  function invertThink(c, dt, t) {
    if (c.holdT > 0) { c.holdT -= dt; c.speedTarget = 0; c.speed = 0; return; }
    c.timer -= dt;

    /* 受惊：逃回石头缝，到了就缩一会儿 */
    if (c.scared > 0) {
      if (c.canHide === true) {
        /* 只有敲缸才真的钻石缝 */
        if (!c.cover) {
          const r = nearestRock(c.x, c.z);
          const dx = c.x - r.x, dz = c.z - r.z;
          const d = Math.hypot(dx, dz) || 1;
          c.cover = { x: r.x + dx / d * (r.r * 0.72), z: r.z + dz / d * (r.r * 0.72) };
          c.mode = 'hide';
        }
        c.targetX = c.cover.x; c.targetZ = c.cover.z;
        c.speedTarget = c.kind === 'shrimp' ? 0.5 : 0.14;
        if (Math.hypot(c.x - c.cover.x, c.z - c.cover.z) < 0.22) {
          /* 到石头边就停住缩起来，但本体一直可见 */
          c.holdT = 1.8 + Math.random() * 0.9;
          c.scared = 0; c.cover = null; c.speedTarget = 0; c.speed = 0;
        }
      } else {
        /* 普通惊吓：加速爬开一小段就停，不消失 */
        c.targetX = c.fleeX !== undefined ? c.fleeX : c.x;
        c.targetZ = c.fleeZ !== undefined ? c.fleeZ : c.z;
        c.speedTarget = c.kind === 'shrimp' ? 0.62 : 0.22;
      }
      return;
    }

    if (c.kind === 'shrimp') {
      /* 吃腐败饲料 */
      let fd = null, bd = 1.7;
      for (const q of foodList) {
        if (!q.rot) continue;
        const d2 = (q.x - c.x) * (q.x - c.x) + (q.z - c.z) * (q.z - c.z);
        if (d2 < bd) { bd = d2; fd = q; }
      }
      if (fd) {
        c.targetX = fd.x; c.targetZ = fd.z; c.speedTarget = 0.4;
        if (Math.hypot(fd.x - c.x, fd.z - c.z) < 0.14) {
          const i = foodList.indexOf(fd);
          if (i >= 0) foodList.splice(i, 1);
          state.quality = Math.min(1, state.quality + 0.035);
          burstSparks(fd.x, fd.y + 0.02, fd.z, 5);
        }
        return;
      }
      /* 清洁站 */
      if (c.mode === 'clean' && c.targetFish) {
        const f = c.targetFish;
        if (Math.hypot(f.x - c.x, f.z - c.z) > 0.13) {
          c.targetX = f.x; c.targetZ = f.z; c.speedTarget = 0.45; c.attached = false;
        } else {
          c.attached = true;
          c.x = f.x + Math.sin(f.heading + Math.PI / 2) * 0.055;
          c.z = f.z + Math.cos(f.heading + Math.PI / 2) * 0.055;
          c.heading = f.heading + Math.PI / 2;
          c.speedTarget = 0; c.speed = 0;
          f.cleanT += dt * 0.55;
          if (f.cleanT >= 2.4) {
            f.cleanT = 0; f.dirty = 22 + Math.random() * 26;
            c.mode = 'wander'; c.targetFish = null; c.timer = 1 + Math.random() * 2;
          }
        }
        return;
      }
      if (c.timer <= 0) {
        c.timer = 2 + Math.random() * 3;
        let best = null, bd2 = 9;
        for (const f of fishList) {
          if (f.dragging || f.hidden > 0) continue;
          if (f.dirty > 0 || f.cleanT > 0) continue;
          const d2 = (f.x - c.x) * (f.x - c.x) + (f.z - c.z) * (f.z - c.z);
          if (d2 < bd2) { bd2 = d2; best = f; }
        }
        if (best) { c.mode = 'clean'; c.targetFish = best; return; }
        c.mode = 'wander';
        c.wanderY = Math.random() < 0.4 ? -0.10 - Math.random() * 0.12 : -0.02;
        c.targetX = clamp(c.x + (Math.random() * 2 - 1) * 2.2, -6.8, 6.8);
        c.targetZ = clamp(c.z + (Math.random() * 2 - 1) * 1.6, -3.6, 3.6);
        c.speedTarget = 0.22 + Math.random() * 0.18;
      }
      const fl = flowVec();
      c.x += fl.x * 0.35 * dt;
      c.z += fl.y * 0.35 * dt;
      c.targetY = c.mode === 'wander' ? c.wanderY : floorHeight(c.x, c.z) + 0.03;
      return;
    }

    /* ---- 寄居蟹 ---- */
    if (c.mode === 'graze' && c.patch) {
      if (c.timer <= 0 || c.patch.size <= 0.02) {
        c.mode = 'wander'; c.patch = null; c.timer = 1 + Math.random() * 2;
      } else if (Math.hypot(c.patch.x - c.x, c.patch.z - c.z) > 0.28) {
        c.targetX = c.patch.x; c.targetZ = c.patch.z; c.speedTarget = 0.08;
      } else {
        c.speedTarget = 0;
        c.patch.size = Math.max(0, c.patch.size - dt * 0.09);
      }
      return;
    }
    if (c.mode === 'swap' && c.shellTarget) {
      if (c.timer <= 0) {
        const old = c.shellSize;
        c.shellSize = c.shellTarget.size;
        c.shellTarget.occupied = true;
        c.shellTarget.owner = c;
        c.shellTarget.mesh.visible = false;
        c.parts.shellMesh.scale.setScalar(c.shellSize);
        /* 旧壳留在原地，别的蟹可以捡 */
        const m = makeSpareShellMesh(old);
        m.position.set(c.x, floorHeight(c.x, c.z) + 0.015, c.z);
        m.rotation.y = Math.random() * 6.283;
        m.layers.set(0);
        sceneryRoot.add(m);
        spareShells.push({ x: c.x, z: c.z, size: old, mesh: m, occupied: false, owner: null });
        c.mode = 'wander'; c.shellTarget = null; c.timer = 2 + Math.random() * 2;
        toast(c.name + ' 换了个新壳');
      } else { c.speedTarget = 0; }
      return;
    }
    if (c.timer <= 0) {
      c.timer = 2.5 + Math.random() * 3.5;
      let patch = null, bd = 7;
      for (const p of algaeList) {
        if (p.size < 0.18) continue;
        const d2 = (p.x - c.x) * (p.x - c.x) + (p.z - c.z) * (p.z - c.z);
        if (d2 < bd) { bd = d2; patch = p; }
      }
      let shell = null, bs = c.shellSize + 0.06;
      for (const s of spareShells) {
        if (s.occupied || s.size < bs) continue;
        const d2 = (s.x - c.x) * (s.x - c.x) + (s.z - c.z) * (s.z - c.z);
        if (d2 < 2.4) { bs = s.size; shell = s; }
      }
      if (patch && (!shell || bd < 3.2)) { c.mode = 'graze'; c.patch = patch; }
      else if (shell) { c.mode = 'swap'; c.shellTarget = shell; c.timer = 1.4; }
      else {
        c.mode = 'wander';
        c.targetX = clamp(c.x + (Math.random() * 2 - 1) * 1.6, -6.8, 6.8);
        c.targetZ = clamp(c.z + (Math.random() * 2 - 1) * 1.2, -3.6, 3.6);
        c.speedTarget = 0.05 + Math.random() * 0.05;
      }
    }
  }

  function invertMove(c, dt) {
    const desired = Math.atan2(c.targetX - c.x, c.targetZ - c.z);
    let diff = desired - c.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const turnMax = (c.scared > 0 ? 3.4 : 1.6) * dt;
    c.heading += clamp(diff, -turnMax, turnMax);
    c.speed += (c.speedTarget - c.speed) * Math.min(1, dt * 2);
    let nx = c.x + Math.sin(c.heading) * c.speed * dt;
    let nz = c.z + Math.cos(c.heading) * c.speed * dt;
    const mx = 7.1, mz = 3.9;
    nx = clamp(nx, -mx, mx);
    nz = clamp(nz, -mz, mz);
    for (let i = 0; i < SCENERY_LAYOUT.rocks.length; i++) {
      const r = SCENERY_LAYOUT.rocks[i];
      const dx = nx - r.x, dz = nz - r.z;
      const rr = r.r * 0.85 + 0.12;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr) {
        const d = Math.sqrt(d2) + 0.001;
        nx = r.x + dx / d * rr;
        nz = r.z + dz / d * rr;
      }
    }
    const px = nx - SCENERY_LAYOUT.platform.x;
    const pz = nz - SCENERY_LAYOUT.platform.z;
    const pd = Math.sqrt(px * px + pz * pz);
    if (pd < 2.0) {
      const k = 2.0 / Math.max(pd, 0.001);
      nx = SCENERY_LAYOUT.platform.x + px * k;
      nz = SCENERY_LAYOUT.platform.z + pz * k;
    }
    c.x = nx;
    c.z = nz;
  }

  function updateInverts(dt, t) {
    const shDummy = new THREE.Object3D();
    let shI = fishList.length > 32 ? 32 : fishList.length;
    /* 虾蟹投影并入鱼影网格（从鱼影计数之后接着写） */
    for (let i = 0; i < invertList.length; i++) {
      const c = invertList[i];
      c.scared = Math.max(0, c.scared - dt);
      if (!c.dragging) {
        if (c.hidden > 0) { c.hidden -= dt; }
        else { invertThink(c, dt, t); invertMove(c, dt); }
      }
      const g = c.group;
      const bobY = c.kind === 'shrimp' ? Math.sin(t * 1.8 + c.phase) * 0.006 : Math.abs(Math.sin(t * 5 + c.phase)) * 0.004 * Math.min(1, c.speed * 12);
      const targetY = c.dragging ? 0.3 : (c.kind === 'shrimp'
        ? (c.targetY !== undefined ? c.targetY : floorHeight(c.x, c.z) + 0.02)
        : floorHeight(c.x, c.z) + 0.015);
      c.y += (targetY - c.y) * Math.min(1, dt * 3);
      const hideT = (c.dragging || c.hidden > 0) ? 1 : 0;
      c.hideMix = (c.hideMix || 0) + (hideT - (c.hideMix || 0)) * Math.min(1, dt * 11);
      const scI = 1 - c.hideMix;
      g.visible = scI > 0.02;
      g.scale.setScalar(scI);
      g.position.set(c.x, c.y + bobY, c.z);
      g.rotation.y = c.heading;
      /* 受惊缩回 */
      const rt = (c.scared > 0 || c.holdT > 0) ? 1 : 0;
      c.retractAmt += (rt - c.retractAmt) * Math.min(1, dt * 8);
      const rs = 1 - 0.82 * c.retractAmt;
      const parts = c.parts;
      if (parts && parts.retract) {
        for (let k = 0; k < parts.retract.length; k++) parts.retract[k].scale.setScalar(rs);
      }
      /* 触须摆动 / 蟹腿起伏 */
      if (parts && parts.antMesh) parts.antMesh.rotation.x = Math.sin(t * 2.2 + c.phase) * 0.18;
      if (parts && parts.tailMesh) parts.tailMesh.rotation.y = Math.sin(t * 3.1 + c.phase) * 0.10;
      if (parts && parts.legMesh && c.speed > 0.02) parts.legMesh.position.y = Math.abs(Math.sin(t * 6 + c.phase)) * 0.004;

      /* 投影 */
      if (fishShadowMesh && !c.dragging && c.hidden <= 0 && shI < FISH_MAX + INVERT_MAX * 2) {
        shDummy.position.set(c.x + 0.05, floorHeight(c.x, c.z) + 0.022, c.z + 0.07);
        shDummy.rotation.set(0, 0, 0);
        const sr = c.kind === 'shrimp' ? 0.30 : 0.34;
        shDummy.scale.set(sr, 1, sr * 1.5);
        shDummy.updateMatrix();
        fishShadowMesh.setMatrixAt(shI, shDummy.matrix);
        shI++;
      }
    }
    if (fishShadowMesh && shI > fishShadowMesh.count) {
      fishShadowMesh.count = shI;
      fishShadowMesh.instanceMatrix.needsUpdate = true;
    }
  }

  /* ---- 气泡 ---- */
  const BUBBLE_POS = { x: 4.35, z: 1.65 };
  function updateBubbles(dt, t) {
    if (state.bubblesOn) {
      bubbleSpawnAcc += dt * 9;
      while (bubbleSpawnAcc >= 1) {
        bubbleSpawnAcc--;
        if (bubbleList.length < 56) {
          const by = floorHeight(BUBBLE_POS.x, BUBBLE_POS.z) + 0.08;
          bubbleList.push({
            x: BUBBLE_POS.x + (Math.random() - 0.5) * 0.10,
            z: BUBBLE_POS.z + (Math.random() - 0.5) * 0.10,
            y: by,
            vy: 0.44 + Math.random() * 0.30,
            ph: Math.random() * 6.283,
            s: 0.062 + Math.random() * 0.075
          });
        }
      }
    }
    const dummy = new THREE.Object3D();
    const fl = flowVec();
    for (let i = bubbleList.length - 1; i >= 0; i--) {
      const b = bubbleList[i];
      b.y += b.vy * dt;
      b.x += (Math.sin(t * 3.1 + b.ph) * 0.09 + fl.x * 0.5) * dt;
      b.z += (Math.cos(t * 2.7 + b.ph) * 0.09 + fl.y * 0.5) * dt;
      if (b.y >= -0.005) {
        bubbleList.splice(i, 1);
        addRipple(b.x, b.z, 0.10, 0.22);
        if (t - sfx.lastPlip > 0.07) { sfx.lastPlip = t; sfx.play('plip', 0.5); }
        continue;
      }
      const sc = b.s * (1 + 0.08 * Math.sin(t * 9 + b.ph));
      dummy.position.set(b.x, b.y, b.z);
      dummy.scale.setScalar(sc);
      dummy.updateMatrix();
      bubbleMesh.setMatrixAt(i, dummy.matrix);
      dummy.scale.setScalar(sc * 0.52);
      dummy.updateMatrix();
      bubbleCore.setMatrixAt(i, dummy.matrix);
    }
    bubbleMesh.count = bubbleList.length;
    bubbleCore.count = bubbleList.length;
    bubbleMesh.instanceMatrix.needsUpdate = true;
    bubbleCore.instanceMatrix.needsUpdate = true;
  }

  /* ---- 造流微粒 ---- */
  function updateMotes(dt, t) {
    if (state.flow.on) {
      moteSpawnAcc += dt * 7;
      while (moteSpawnAcc >= 1) {
        moteSpawnAcc--;
        if (moteList.length < 30) {
          const fl = flowVec();
          moteList.push({
            x: state.flow.x, z: state.flow.z,
            y: -0.04 - Math.random() * 0.26,
            vx: fl.x * 0.5 + (Math.random() - 0.5) * 0.08,
            vz: fl.y * 0.5 + (Math.random() - 0.5) * 0.08,
            life: 2.4, max: 2.4,
            ph: Math.random() * 6.283
          });
        }
      }
    }
    const dummy = new THREE.Object3D();
    for (let i = moteList.length - 1; i >= 0; i--) {
      const m = moteList[i];
      m.x += m.vx * dt;
      m.z += m.vz * dt;
      m.y += Math.sin(t * 2 + m.ph) * 0.01 * dt;
      m.life -= dt;
      if (m.life <= 0) { moteList.splice(i, 1); continue; }
      const k = m.life / m.max;
      dummy.position.set(m.x, m.y, m.z);
      dummy.rotation.set(0, t + m.ph, 0);
      dummy.scale.setScalar(0.038 * (0.5 + 0.5 * Math.sin(k * Math.PI)));
      dummy.updateMatrix();
      moteMesh.setMatrixAt(i, dummy.matrix);
    }
    moteMesh.count = moteList.length;
    moteMesh.instanceMatrix.needsUpdate = true;
  }

  /* ---- 换水注水 ---- */
  function updatePour(dt, t) {
    if (!state.pour) return;
    const P = state.pour;
    P.t += dt;
    const k = Math.min(1, P.t / 0.5);
    const out = Math.min(1, Math.max(0, (P.dur - P.t) / 0.6));
    const a = Math.min(k, out);
    pourFx.visible = a > 0.01;
    pourStream.material.opacity = 0.55 * a;
    if (pourCore) pourCore.material.opacity = 0.6 * a;
    if (pourFoam) {
      /* 泡沫盘脉动 */
      const pulse = 1 + 0.10 * Math.sin(t * 9.0) + 0.06 * Math.sin(t * 14.3);
      pourFoam.scale.setScalar(pulse);
      pourFoam.material.opacity = 0.72 * a;
    }
    pourRing.scale.setScalar(1 + (1 - k) * 1.8 + P.t * 0.2);
    pourRing.material.opacity = 0.42 * a * (1 - Math.min(1, P.t / P.dur));
    /* 入水涟漪 + 水滴 */
    if (P.t < P.dur - 0.5) {
      if (Math.random() < dt * 26) addRipple(POUR_POS.x + (Math.random() - 0.5) * 0.9, POUR_POS.z + (Math.random() - 0.5) * 0.9, 0.58, 0.42);
    }
    const dd = new THREE.Object3D();
    let alive = 0;
    for (let i = 0; i < dropList.length; i++) {
      const d = dropList[i];
      if (d.life <= 0) continue;
      d.life -= dt;
      d.vy -= 1.1 * dt;
      d.x += d.vx * dt; d.z += d.vz * dt; d.y += d.vy * dt;
      const fh = floorHeight(d.x, d.z) + 0.02;
      if (d.y < fh) { d.life = 0; continue; }
      dd.position.set(d.x, d.y, d.z);
      dd.scale.setScalar(0.02 * Math.min(1, d.life / d.max * 2));
      dd.updateMatrix();
      pourDrops.setMatrixAt(alive++, dd.matrix);
    }
    pourDrops.count = alive;
    pourDrops.instanceMatrix.needsUpdate = true;
    if (P.t > P.dur) {
      state.pour = null;
      pourFx.visible = false;
      /* 清掉沉降的残饵 */
      for (let i = foodList.length - 1; i >= 0; i--) if (foodList[i].landed) foodList.splice(i, 1);
      toast('换水完成，水清亮了');
    }
  }

  /* ---- 星屑（食物被吃） ---- */
  function burstSparks(x, y, z, n) {
    for (let i = 0; i < n; i++) {
      if (sparkList.length >= 24) break;
      const a = Math.random() * 6.283;
      sparkList.push({
        x: x, y: y, z: z,
        vx: Math.cos(a) * (0.1 + Math.random() * 0.25),
        vz: Math.sin(a) * (0.1 + Math.random() * 0.25),
        vy: 0.15 + Math.random() * 0.3,
        life: 0.4 + Math.random() * 0.25,
        max: 0.65
      });
    }
  }

  function updateSparks(dt, t) {
    if (!sparkMesh) return;
    const dummy = new THREE.Object3D();
    for (let i = sparkList.length - 1; i >= 0; i--) {
      const s = sparkList[i];
      s.life -= dt;
      s.vy -= 0.5 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
      if (s.life <= 0 || s.y < 0) { sparkList.splice(i, 1); continue; }
      dummy.position.set(s.x, s.y, s.z);
      dummy.rotation.set(0, t * 3 + i, 0);
      dummy.scale.setScalar(0.028 * Math.max(0.1, s.life / s.max));
      dummy.updateMatrix();
      sparkMesh.setMatrixAt(i, dummy.matrix);
    }
    sparkMesh.count = sparkList.length;
    sparkMesh.instanceMatrix.needsUpdate = true;
  }

  /* ---- 水质 ---- */
  function updateQuality(dt) {
    let rot = 0;
    for (let i = 0; i < foodList.length; i++) if (foodList[i].rot) rot++;
    if (rot > 0) state.quality = Math.max(0.04, state.quality - dt * 0.055 * rot);
    else state.quality = Math.min(1, state.quality + dt * 0.012);
    state.murkTarget = 1 - state.quality;
    state.murk += (state.murkTarget - state.murk) * Math.min(1, dt * 1.5);
    waterUniforms.uMurk.value = state.murk;
  }

  let qUiT = 0;
  function updateQualityUI(dt) {
    qUiT -= dt;
    if (qUiT > 0) return;
    qUiT = 0.25;
    const q = state.quality;
    const fill = $('qFill'), stt = $('qState');
    if (fill) {
      fill.style.width = Math.round(q * 100) + '%';
      fill.style.background = q > 0.78 ? 'linear-gradient(90deg,#89e2cf,#cfe9a8)'
        : q > 0.55 ? 'linear-gradient(90deg,#d8d878,#e8c860)'
          : 'linear-gradient(90deg,#e08a5a,#d85a4a)';
    }
    if (stt) stt.textContent = q > 0.78 ? '清澈' : q > 0.55 ? '微浑' : q > 0.32 ? '浑浊' : '该换水了';
  }

  /* ---- 藻斑 ---- */
  function updateAlgae(dt) {
    for (let i = 0; i < algaeList.length; i++) {
      const p = algaeList[i];
      if (p.size < 1) p.size = Math.min(1, p.size + dt * 0.0016 * (1 - state.quality) * 6);
      const s = p.base * (0.22 + 0.78 * p.size);
      p.mesh.scale.set(s, 1, s * 0.82);
      p.mesh.material.opacity = 0.16 + 0.60 * p.size;
      p.mesh.visible = p.size > 0.03;
    }
  }

  /* ---- 特效初始化 ---- */
  function initFX() {
    /* 气泡石 */
    const stone = new THREE.Group();
    const sm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.05, 12),
      new THREE.MeshStandardMaterial({ color: 0x8a8f94, roughness: 0.9 }));
    sm.position.y = 0.025;
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.012, 12),
      new THREE.MeshStandardMaterial({ color: 0x4a4f54, roughness: 1 }));
    st.position.y = 0.055;
    stone.add(sm, st);
    stone.position.set(BUBBLE_POS.x, floorHeight(BUBBLE_POS.x, BUBBLE_POS.z), BUBBLE_POS.z);
    stone.traverse(function (o) { o.layers.set(0); });
    scene.add(stone);
    addShadow(sceneryRoot || scene, BUBBLE_POS.x, BUBBLE_POS.z, 0.22, 0.3);

    bubbleMesh = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xd8f6ff, transparent: true, opacity: 0.52, depthWrite: false }),
      56);
    bubbleCore = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1, 6, 5),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.72, depthWrite: false }),
      56);
    bubbleMesh.count = 0; bubbleCore.count = 0;
    bubbleMesh.frustumCulled = false; bubbleCore.frustumCulled = false;
    bubbleMesh.layers.set(0); bubbleCore.layers.set(0);
    scene.add(bubbleMesh); scene.add(bubbleCore);

    /* 造流微粒 */
    const mgeo = new THREE.PlaneGeometry(1, 1);
    mgeo.rotateX(-Math.PI / 2);
    moteMesh = new THREE.InstancedMesh(mgeo, new THREE.MeshBasicMaterial({
      map: makeFlakeTexture(), color: 0xbfe8df, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false
    }), 30);
    moteMesh.count = 0;
    moteMesh.frustumCulled = false;
    moteMesh.layers.set(0);
    scene.add(moteMesh);

    /* 星屑 */
    sparkMesh = new THREE.InstancedMesh(mgeo, new THREE.MeshBasicMaterial({
      map: makeFlakeTexture(), color: 0xffe6b0, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    }), 24);
    sparkMesh.count = 0;
    sparkMesh.frustumCulled = false;
    sparkMesh.layers.set(1);
    scene.add(sparkMesh);

    /* 换水：泡沫盘 + 短水柱 + 水花环 + 水滴（俯视时水柱只露 rim，主要靠泡沫盘读形） */
    pourFx = new THREE.Group();
    pourStream = new THREE.Mesh(
      new THREE.CylinderGeometry(0.40, 0.50, 1.7, 14, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xd4f2f9, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
    pourStream.position.set(POUR_POS.x, 0.85, POUR_POS.z);
    const pourCoreMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.19, 0.24, 1.7, 10, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xeafcff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false }));
    pourCoreMesh.position.set(POUR_POS.x, 0.85, POUR_POS.z);
    pourCore = pourCoreMesh;
    const foamGeo = new THREE.CircleGeometry(0.92, 28);
    foamGeo.rotateX(-Math.PI / 2);
    pourFoam = new THREE.Mesh(foamGeo, new THREE.MeshBasicMaterial({
      color: 0xf2fdff, transparent: true, opacity: 0.72, depthWrite: false
    }));
    pourFoam.position.set(POUR_POS.x, 0.025, POUR_POS.z);
    const ringGeo = new THREE.RingGeometry(0.5, 0.62, 40);
    ringGeo.rotateX(-Math.PI / 2);
    pourRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xe4fafd, transparent: true, opacity: 0.62, depthWrite: false
    }));
    pourRing.position.set(POUR_POS.x, 0.02, POUR_POS.z);
    pourDrops = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1, 6, 5),
      new THREE.MeshBasicMaterial({ color: 0xdff6fa, transparent: true, opacity: 0.75, depthWrite: false }),
      14);
    pourDrops.count = 0;
    pourDrops.frustumCulled = false;
    pourFx.add(pourStream, pourCore, pourFoam, pourRing, pourDrops);
    pourFx.traverse(function (o) { o.layers.set(1); });
    pourFx.visible = false;
    scene.add(pourFx);

    /* 造流出口标记 */
    flowMarker = new THREE.Group();
    const pipe = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.075, 0.34, 10),
      new THREE.MeshStandardMaterial({ color: 0x2c3a40, roughness: 0.6 }));
    pipe.rotation.z = Math.PI / 2;
    pipe.position.y = 0.08;
    const fring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0x8fe3d2, transparent: true, opacity: 0.45, depthWrite: false
    }));
    fring.scale.setScalar(0.8);
    fring.position.y = 0.005;
    flowMarker.add(pipe, fring);
    flowMarker.traverse(function (o) { o.layers.set(1); });
    setFlowPos(state.flow.x, state.flow.z);
    flowMarker.visible = false;
    scene.add(flowMarker);
  }

  function initDrawer() {
    drawerEl = $('drawer');
    drawerPanel = $('drawerPanel');
    const cards = $('cards');
    for (let i = 0; i < DRAWER_IDS.length; i++) {
      const id = DRAWER_IDS[i];
      const sp = SPECIES[id];
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = id;
      card.innerHTML = '<div class="thumb"></div><div class="nm">' + sp.name + '</div>' +
        '<div class="lt">' + sp.latin + '</div><div class="ct">0</div>';
      const thumb = card.querySelector('.thumb');
      if (thumbUrls[id]) thumb.style.backgroundImage = 'url(' + thumbUrls[id] + ')';
      card.addEventListener('pointerdown', onCardDown);
      cards.appendChild(card);
    }
    $('drawerTab').addEventListener('click', function () { drawerEl.classList.toggle('open'); });
    $('drawerClose').addEventListener('click', function () { drawerEl.classList.remove('open'); });
    if (window.innerWidth >= 1080) drawerEl.classList.add('open');
    updateFishCount();
  }

  function onCardDown(e) {
    const id = e.currentTarget.dataset.id;
    if (!id || !SPECIES[id]) return;
    e.preventDefault();
    e.stopPropagation();
    if (cardDrag) return;
    cardDrag = { id: id, startX: e.clientX, startY: e.clientY, moved: false, ghost: null };
    window.addEventListener('pointermove', onCardMove);
    window.addEventListener('pointerup', onCardUp, { once: true });
  }

  function onCardMove(e) {
    if (!cardDrag) return;
    const dx = e.clientX - cardDrag.startX;
    const dy = e.clientY - cardDrag.startY;
    if (!cardDrag.moved && Math.hypot(dx, dy) > 7) {
      cardDrag.moved = true;
      const p = waterPoint(e.clientX, e.clientY);
      cardDrag.ghost = showGhost(cardDrag.id, p ? p.x : 0, p ? p.z : 0);
    }
    if (cardDrag.moved && cardDrag.ghost) {
      const p = waterPoint(e.clientX, e.clientY);
      if (p) {
        cardDrag.ghost.visible = true;
        cardDrag.ghost.position.set(p.x, 0.30, p.z);
      } else {
        cardDrag.ghost.visible = false;
      }
    }
  }

  function onCardUp(e) {
    window.removeEventListener('pointermove', onCardMove);
    if (!cardDrag) return;
    const c = cardDrag;
    cardDrag = null;
    hideGhost();
    if (c.moved) {
      const p = waterPoint(e.clientX, e.clientY);
      if (p && !isOverDrawer(e.clientX, e.clientY)) spawnCreature(c.id, p.x, p.z);
    } else {
      const s = findFreeSpot();
      spawnCreature(c.id, s.x, s.z);
    }
  }

  function isOverDrawer(cx, cy) {
    if (!drawerEl || !drawerEl.classList.contains('open') || !drawerPanel) return false;
    const r = drawerPanel.getBoundingClientRect();
    return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
  }

  /* =========================================================================
     ⑤ 互动插件
     ========================================================================= */

  const plugins = [];

  function registerPlugin(p) {
    plugins.push(p);
    if (p.init) p.init();
    return p;
  }

  function initPlugins() {
    /* 点击水面 / 戳生物 / 拖拽 */
    registerPlugin({
      name: 'ripple',
      init() {
        canvas.addEventListener('pointerdown', onPointerDown, { passive: true });
        canvas.addEventListener('pointermove', onPointerMove, { passive: true });
        canvas.addEventListener('pointerup', onPointerUp, { passive: true });
        canvas.addEventListener('pointercancel', onPointerCancel, { passive: true });
      },
      dispose() {
        canvas.removeEventListener('pointerdown', onPointerDown);
        canvas.removeEventListener('pointermove', onPointerMove);
        canvas.removeEventListener('pointerup', onPointerUp);
        canvas.removeEventListener('pointercancel', onPointerCancel);
      }
    });

    /* 静水 */
    registerPlugin({
      name: 'calm',
      init() { Bus.on('user:calm', setCalm); },
      update() {}
    });

    /* 灯光 */
    registerPlugin({
      name: 'lights',
      init() { Bus.on('user:light', cycleLight); },
      update(dt) {
        let target = 0;
        if (state.lightMode === 'night') target = 1;
        else if (state.lightMode === 'auto') {
          const p = (state.time % 120) / 120;
          if (p < 0.70) target = 0;
          else if (p < 0.78) target = smooth((p - 0.70) / 0.08);
          else if (p < 0.94) target = 1;
          else target = 1 - smooth((p - 0.94) / 0.06);
        }
        state.nightMix += (target - state.nightMix) * Math.min(1, dt * 2.4);
        applyPalette(state.nightMix);
      }
    });

    /* 界面隐藏 */
    registerPlugin({
      name: 'bare',
      init() { Bus.on('user:bare', toggleBare); }
    });
  }

  let pointerStart = null;
  let pendingFish = null;
  let panMoved = false;

  function waterPoint(cx, cy) {
    if (!waterRay.plane) {
      waterRay.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      waterRay.ray = new THREE.Raycaster();
    }
    const ndc = new THREE.Vector2(
      (cx / window.innerWidth) * 2 - 1,
      -(cy / window.innerHeight) * 2 + 1
    );
    waterRay.ray.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (!waterRay.ray.ray.intersectPlane(waterRay.plane, hit)) return null;
    if (Math.abs(hit.x) > CONFIG.tank.w / 2 || Math.abs(hit.z) > CONFIG.tank.d / 2) return null;
    return hit;
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const p = waterPoint(e.clientX, e.clientY);
    if (p) {
      const f = nearestCreature(p.x, p.z, 0.55);
      if (f) {
        /* 只记候选；真的拖出 6px 才进入拖拽态 */
        pendingFish = { f: f, startX: e.clientX, startY: e.clientY };
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        return;
      }
    }
    pointerStart = { x: e.clientX, y: e.clientY, t: performance.now() };
  }

  function onPointerMove(e) {
    if (pendingFish && !dragFish) {
      if (Math.hypot(e.clientX - pendingFish.startX, e.clientY - pendingFish.startY) > 6) {
        const pf = pendingFish.f;
        dragFish = {
          f: pf, startX: pendingFish.startX, startY: pendingFish.startY, moved: true,
          ghost: showGhost(pf.id, pf.x, pf.z, pf.heading, pf.phase)
        };
        pf.dragging = true;
        pendingFish = null;
        /* 出水：一圈扩散环 + 水花 */
        addRipple(pf.x, pf.z, 0.62, 0.55);
        if (typeof burstSparks === 'function') burstSparks(pf.x, 0.02, pf.z, 7);
      } else {
        return;
      }
    }
    if (dragFish) {
      const dx = e.clientX - dragFish.startX;
      const dy = e.clientY - dragFish.startY;
      if (Math.hypot(dx, dy) > 6) dragFish.moved = true;
      if (!dragFish.ghost) return;
      /* 被捉住的生物会挣扎：身体左右扭、上下扑腾、持续拍出小水环 */
      const tt = state.time;
      dragFish.ghost.rotation.z = Math.sin(tt * 11.5) * 0.30;
      dragFish.ghost.rotation.x = Math.sin(tt * 8.3) * 0.13;
      dragFish.ghost.position.y = 0.06 + Math.sin(tt * 9.5) * 0.035;
      if (tt - (dragFish.lastRip || 0) > 0.17) {
        dragFish.lastRip = tt;
        addRipple(dragFish.ghost.position.x, dragFish.ghost.position.z, 0.20, 0.22);
      }
      const p = waterPoint(e.clientX, e.clientY);
      if (p) {
        dragFish.ghost.visible = true;
        dragFish.ghost.position.set(p.x, 0.30, p.z);
      } else {
        dragFish.ghost.visible = false;
      }
      return;
    }
    /* 特写机位：拖动空白水面平移取景框（点哪看哪） */
    if (camIndex === 1 && pointerStart && !dragFish && !pendingFish) {
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      if (Math.hypot(dx, dy) > 7) {
        panMoved = true;
        const w = Math.max(1, window.innerWidth);
        const h = Math.max(1, window.innerHeight);
        const vx = waterUniforms.uViewX.value;
        const vy = waterUniforms.uViewY.value;
        const ddx = (dx / w) * vx.x - (dy / h) * vy.x;
        const ddz = (dx / w) * vx.y - (dy / h) * vy.y;
        camGoal.tx = clamp(camGoal.tx - ddx, -4.6, 4.6);
        camGoal.tz = clamp(camGoal.tz - ddz, -2.6, 2.6);
        camPose.tx = camGoal.tx;
        camPose.tz = camGoal.tz;
        updateCamera();
        pointerStart.x = e.clientX;
        pointerStart.y = e.clientY;
      }
      return;
    }

    /* 造流开启时：拖动水面即移动出水口 */
    if (state.flow.on && pointerStart) {
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      if (Math.hypot(dx, dy) > 10) {
        const p = waterPoint(e.clientX, e.clientY);
        if (p) setFlowPos(p.x, p.z);
      }
    }
  }

  function onPointerUp(e) {
    if (pendingFish && !dragFish) {
      const pf = pendingFish.f;
      pendingFish = null;
      scareFish(pf.x, pf.z, 1.3, 1.0);
      addRipple(pf.x, pf.z, 0.35, 0.45);
      Bus.emit('fish:poke', { id: pf.id, x: pf.x, z: pf.z });
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    if (dragFish) {
      const d = dragFish;
      dragFish = null;
      const f = d.f;
      f.dragging = false;
      hideGhost();
      if (!d.moved) {
        scareFish(f.x, f.z, 1.3, 1.0);
        addRipple(f.x, f.z, 0.35, 0.45);
        Bus.emit('fish:poke', { id: f.id, x: f.x, z: f.z });
      } else if (isOverDrawer(e.clientX, e.clientY)) {
        if (f.kind === 'fish') { removeFish(f); toast(f.name + ' 已移回抽屉'); }
        else { removeInvert(f); toast(f.name + ' 已移回抽屉'); }
      } else {
        const p = waterPoint(e.clientX, e.clientY);
        if (p) {
          f.x = p.x; f.z = p.z;
          /* 保留拖动时的朝向，避免"放回水里瞬间变姿势" */
          if (f.v) f.speed = f.v.speed * 0.6;
          /* 入水：更大的环 + 水花 */
          addRipple(p.x, p.z, 0.72, 0.60);
          if (typeof burstSparks === 'function') burstSparks(p.x, 0.02, p.z, 9);
        }
      }
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      return;
    }

    if (!pointerStart) return;
    if (panMoved) { panMoved = false; pointerStart = null; return; }
    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    const dt = performance.now() - pointerStart.t;
    pointerStart = null;
    if (Math.sqrt(dx * dx + dy * dy) < 9 && dt < 520) {
      /* 双击 = 敲缸 */
      const now = performance.now();
      if (now - state.lastTap.t < 380 &&
        Math.hypot(e.clientX - state.lastTap.x, e.clientY - state.lastTap.y) < 60) {
        state.lastTap.t = 0;
        doKnock(e.clientX, e.clientY);
      } else {
        state.lastTap.t = now;
        state.lastTap.x = e.clientX;
        state.lastTap.y = e.clientY;
        tapWater(e.clientX, e.clientY);
      }
    }
  }

  function onPointerCancel() {
    pointerStart = null;
    pendingFish = null;
    if (dragFish) { dragFish.f.dragging = false; dragFish = null; }
    hideGhost();
  }

  const waterRay = { plane: null, ray: null };

  function tapWater(cx, cy) {
    const hit = waterPoint(cx, cy);
    if (!hit) return;
    /* 晒台不在水面上，点它不产生涟漪 */
    if (Math.hypot(hit.x - SCENERY_LAYOUT.platform.x, hit.z - SCENERY_LAYOUT.platform.z) < 1.9) return;

    const f = nearestCreature(hit.x, hit.z, 0.55);
    if (f) scareFish(f.x, f.z, 1.5, 1.0);
    else scareFish(hit.x, hit.z, 1.4, 0.6);

    if (state.calm) setCalm(false);
    addRipple(hit.x, hit.z, 1.10, 0.60);
    Bus.emit('water:ripple', { x: hit.x, z: hit.z, kind: 'tap' });
  }

  function setCalm(v) {
    state.calm = v;
